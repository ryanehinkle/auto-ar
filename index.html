<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARmatic</title>
  <style>
    :root{color-scheme:dark;--bg:#080809;--panel:#18181b;--panel2:#1d1d21;--border:#34343b;--soft:#29292f;--text:#f5f5f7;--muted:#9696a0;--blue:#5185bd;--green:#65b47e}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 24%,#17171a 0%,#0d0d0f 40%,#080809 74%);color:var(--text)}
    button,input{font:inherit}button{color:inherit}#pdfInput,#toastCsvInput{display:none}
    .landing{min-height:100vh;display:grid;place-items:center;padding:24px}
    .landing-card{width:min(92vw,520px);padding:52px 42px 42px;text-align:center;background:var(--panel);border:1px solid #3a3a40;border-radius:14px;box-shadow:0 28px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03)}
    .brand-mark{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 16px;border:1px solid #486f9a;border-radius:14px;background:linear-gradient(145deg,#21364d,#142333);color:#9fc4ec;font:800 1.45rem Georgia,"Times New Roman",serif;box-shadow:0 10px 28px rgba(34,80,126,.2)}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.6rem,8vw,4rem);line-height:.98;letter-spacing:-.045em;color:#fff;text-shadow:2px 2px 0 #2c2c31}
    .brand-title .brand-ar{color:#6f9fd1}
    .brand-title .brand-matic{color:#fff}
    .landing-subtitle{max-width:390px;margin:14px auto 0;color:#a4a4ae;font-size:.97rem;line-height:1.55}
    .upload-zone{margin-top:30px;padding:18px;border:1px dashed #3d4e62;border-radius:12px;background:#13161a;transition:.16s ease}
    .upload-zone.dragging{border-color:#70a7df;background:#161d25;transform:translateY(-1px)}
    .upload-button{width:100%;border:1px solid #6698d0;border-radius:11px;padding:15px 22px;background:var(--blue);color:#fff;font-size:1.02rem;font-weight:800;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.13);transition:.16s ease}
    .upload-button:hover{background:#5e93cc;transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.16)}
    .upload-hint{margin-top:10px;color:#777783;font-size:.78rem}
    .error-card{display:none;margin-top:18px;padding:13px 14px;border:1px solid #623b3b;border-radius:9px;background:#241718;color:#e3a5a5;font-size:.84rem;line-height:1.45}.error-card.visible{display:block}
    .app{display:none;width:min(94vw,1480px);margin:0 auto;padding:38px 0 74px}.app.active{display:block}
    .app-header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}
    .app-brand{cursor:pointer;user-select:none}.app-brand h1{font-size:clamp(2.15rem,4vw,3rem)}.app-brand p{margin-top:7px;color:var(--muted);font-size:.9rem}
    .new-file-button{flex:0 0 auto;border:1px solid #44444b;border-radius:10px;padding:11px 15px;background:#242429;color:#d8d8de;font-weight:750;cursor:pointer}.new-file-button:hover{background:#2e2e34;border-color:#55555e}
    .file-strip{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px;padding:13px 16px;border:1px solid var(--soft);border-radius:10px;background:#121215;color:#b8b8c0;font-size:.84rem}
    .file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e5e5e9;font-weight:700}.file-meta{flex:0 0 auto;color:#7f7f89}
    .analysis-grid{display:grid;grid-template-columns:minmax(320px,.82fr) minmax(0,1.18fr);gap:20px;align-items:start}
    .panel{min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:13px;background:var(--panel);box-shadow:0 16px 46px rgba(0,0,0,.25)}
    .panel-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;border-bottom:1px solid #2d2d33;background:#1b1b1f}
    .panel-title{color:#f1f1f4;font-size:.9rem;font-weight:800}.status{display:inline-flex;align-items:center;gap:7px;color:#8fbe9d;font-size:.76rem;font-weight:800}.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px rgba(101,180,126,.5)}
    .terminal{min-height:320px;max-height:520px;overflow:auto;padding:18px;background:linear-gradient(rgba(81,133,189,.025) 1px,transparent 1px);background-size:100% 25px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .terminal-line{display:flex;gap:10px;min-height:25px;color:#c8c8cf;font-size:.79rem;line-height:1.65}.prompt{flex:0 0 auto;color:#6599d0;font-weight:800}.terminal-line.success .prompt{color:var(--green)}.terminal-line.muted{color:#777781}
    .cursor{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-.12em;background:#8ab5e0;animation:blink .75s steps(1) infinite}@keyframes blink{50%{opacity:0}}
    .summary{padding:18px}.hero-event{margin-bottom:18px;padding:18px;border:1px solid #354151;border-radius:11px;background:radial-gradient(circle at 100% 0%,rgba(81,133,189,.13),transparent 44%),#15181c}
    .eyebrow{color:#74a5d9;font-size:.68rem;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.event-title{margin-top:7px;color:#fff;font-size:clamp(1.35rem,3vw,2rem);font-weight:850;letter-spacing:-.03em;line-height:1.1}.event-subtitle{margin-top:8px;color:#9797a1;font-size:.86rem;line-height:1.45}
    .quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-card,.field{min-width:0;padding:12px 13px;border:1px solid #2d2d33;border-radius:9px;background:#151519}
    .quick-label,.field-label{color:#7f7f89;font-size:.66rem;font-weight:800;letter-spacing:.055em;text-transform:uppercase}.quick-value,.field-value{margin-top:5px;overflow-wrap:anywhere;color:#e8e8ec;font-size:.88rem;font-weight:720;line-height:1.35}
    .details{grid-column:1/-1;margin-top:20px}.details-body{padding:18px}.section-block+.section-block{margin-top:22px;padding-top:22px;border-top:1px solid #29292f}.section-heading{margin-bottom:12px;color:#e9e9ed;font-size:.93rem;font-weight:850}
    .field-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.field{padding:11px 12px;border-color:#2b2b31}.field.wide{grid-column:1/-1}.field-value{color:#dedee4;font-size:.82rem;font-weight:400}
    .raw-toggle{display:inline-flex;align-items:center;gap:8px;border:0;padding:0;background:transparent;color:#8faed0;font-size:.78rem;font-weight:750;cursor:pointer}.raw-text{display:none;max-height:460px;overflow:auto;margin-top:12px;padding:14px;border:1px solid #29292f;border-radius:9px;background:#101013;color:#9b9ba5;font:.72rem/1.55 "SFMono-Regular",Consolas,monospace;white-space:pre-wrap;word-break:break-word}.raw-text.open{display:block}
    .reveal{opacity:0;transform:translateY(7px);transition:opacity .28s ease,transform .28s ease}.reveal.show{opacity:1;transform:translateY(0)}
    @media(max-width:1000px){.analysis-grid{grid-template-columns:1fr}.details{grid-column:auto}.field-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:700px){.app{width:min(92vw,1480px);padding-top:26px}.app-header{align-items:flex-start;flex-direction:column}.field-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-grid{grid-template-columns:1fr}.landing-card{padding:42px 24px 30px}}
    @media(max-width:430px){.field-grid{grid-template-columns:1fr}.file-strip{align-items:flex-start;flex-direction:column;gap:6px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  
    .scan-panel{margin-bottom:20px}
    .scan-panel .terminal{min-height:0;max-height:190px}
    .scan-progress{height:3px;background:#24242a;overflow:hidden}
    .scan-progress-bar{width:0;height:100%;background:#5e93cc;transition:width .16s ease}
    .events-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px;margin:28px 0 14px}
    .events-title-group{display:flex;align-items:center;gap:16px;min-width:0;justify-self:start}
    .events-head h2{font-size:1.1rem;color:#f4f4f6}
    .events-progress{display:flex;align-items:center;gap:8px;min-width:150px}
    .events-progress-track{width:118px;height:6px;overflow:hidden;border-radius:999px;background:#29292f;border:1px solid #33333a}
    .events-progress-bar{width:0;height:100%;border-radius:999px;background:#79c990;transition:width .24s ease}
    .events-progress-text{min-width:32px;color:#9aa0a7;font-size:.7rem;font-weight:850;font-variant-numeric:tabular-nums}
    .portfolio-sales{justify-self:center;min-width:240px;text-align:center;line-height:1}
    .portfolio-sales-value{color:#f5f5f7;font-size:1.85rem;font-weight:950;letter-spacing:-.035em;font-variant-numeric:tabular-nums;text-shadow:0 5px 22px rgba(0,0,0,.35)}
    .portfolio-sales-date{margin-top:7px;color:#9a9aa4;font-size:.76rem;font-weight:750;letter-spacing:.01em}
    .events-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;min-width:0;justify-self:end}
    .event-count{color:#8fbe9d;font-size:.8rem;font-weight:800;white-space:nowrap}
    .toast-upload-button{border:1px solid #9c744d;border-radius:9px;padding:8px 13px;background:#2b241d;color:#e7bc91;font-size:.75rem;font-weight:850;cursor:pointer;transition:.15s ease;white-space:nowrap}
    .toast-upload-button:hover:not(:disabled){background:#382b20;border-color:#ba8958;color:#f0cba8}
    .toast-upload-button:disabled{opacity:.4;cursor:default}
    .export-button{border:1px solid #47729e;border-radius:9px;padding:8px 13px;background:#1b2a39;color:#a9cef1;font-size:.75rem;font-weight:850;cursor:pointer;transition:.15s ease}
    .export-button:hover:not(:disabled){background:#22374b;border-color:#5c8bbb;color:#c0dcf5}
    .export-button:disabled{opacity:.4;cursor:default}
    .events-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .event-card{min-width:0;overflow:hidden;border:1px solid #303036;border-radius:13px;background:#18181b;box-shadow:0 12px 34px rgba(0,0,0,.22);transition:transform .16s ease,border-color .16s ease}
    .event-card:hover{transform:translateY(-2px);border-color:#494951}
    .event-preview{position:relative;height:190px;display:grid;place-items:center;overflow:hidden;background:#efefef;border-bottom:1px solid #303036;cursor:pointer}
    .event-preview canvas{display:block;max-width:100%;max-height:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
    .event-card-body{padding:15px}
    .event-kicker{display:flex;justify-content:space-between;gap:10px;color:#6f9fd1;font-size:.72rem;font-weight:850;letter-spacing:.07em;text-transform:uppercase}
    .event-name{margin-top:7px;color:#fff;font-size:1.05rem;font-weight:850;line-height:1.2;overflow-wrap:anywhere}
    .event-tags{position:absolute;top:10px;right:10px;z-index:2;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:62%}

    .subtotal-check{position:absolute;top:10px;left:10px;z-index:3;width:26px;height:26px;display:none;align-items:center;justify-content:center;border-radius:50%;font-size:.9rem;font-weight:950;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.18);transform:scale(.55);opacity:0}
    .subtotal-check.visible{display:flex;animation:subtotalCheckPop .38s cubic-bezier(.2,.85,.25,1.25) forwards}
    .subtotal-check.pass{border:1px solid #8ad4a0;background:#dcf7e4;color:#257241}
    .subtotal-check.warn{border:1px solid #e6cc78;background:#fff4bf;color:#8a6b0b}
    .subtotal-check.missing{border:1px solid #e88c8c;background:#ffe2e2;color:#a63838}
    .subtotal-check::after{content:attr(data-tooltip);position:absolute;left:0;top:34px;min-width:max-content;padding:6px 8px;border:1px solid #3b3b42;border-radius:7px;background:#17171b;color:#e2e2e7;font-size:.61rem;font-weight:750;letter-spacing:0;text-transform:none;white-space:pre-line;text-align:left;line-height:1.45;box-shadow:0 5px 16px rgba(0,0,0,.28);opacity:0;pointer-events:none;transform:translateY(-3px);transition:.14s ease}
    .subtotal-check:hover::after{opacity:1;transform:translateY(0)}
    @keyframes subtotalCheckPop{0%{opacity:0;transform:scale(.55) rotate(-14deg)}70%{opacity:1;transform:scale(1.12) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}

    .event-tag{padding:4px 8px;border:1px solid transparent;border-radius:999px;font-size:.61rem;font-weight:900;letter-spacing:.055em;text-transform:uppercase;box-shadow:0 2px 7px rgba(0,0,0,.12)}
    .event-tag.buffet{border-color:#95c7f1;background:#dff1ff;color:#245d8d}
    .event-tag.youth{border-color:#efb1cb;background:#ffe3ef;color:#8d345a}
    .event-tag.flex{border-color:#9dd7ab;background:#e1f6e6;color:#2f7041}
    .event-tag.faves,.event-tag.pleaser{border-color:#e5cf79;background:#fff4bf;color:#76620d}
    .event-tag.field-trip{border-color:#c5b4e8;background:#eee7ff;color:#5e4790}
    .event-tag.play-it-forward{border-color:#c8c8cd;background:#ececef;color:#616169}
    .event-tag.other{border-color:#c8c8cd;background:#ececef;color:#616169}
    .event-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .meta-chip{padding:5px 7px;border:1px solid #303038;border-radius:7px;background:#141418;color:#b6b6bf;font-size:.7rem;font-weight:700}
    .finance-wrap{margin-top:14px;padding-top:13px;border-top:1px solid #29292f}
    .finance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
    .finance-item{min-width:0;padding:9px 10px;border:1px solid #2b2b31;border-radius:8px;background:#151519}
    .finance-label{color:#74747e;font-size:.59rem;font-weight:850;letter-spacing:.04em;text-transform:uppercase}
    .finance-value{margin-top:4px;color:#e6e6ea;font-size:.83rem;font-weight:850}
    .finance-value-line{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-top:4px}
    .finance-original{color:#73737d;font-size:.72rem;font-weight:750;text-decoration:line-through;text-decoration-thickness:1.5px}
    .finance-discounted{color:#e6e6ea;font-size:.83rem;font-weight:900}
    .finance-incentive-note{margin-top:4px;color:#ddddE4;font-size:.64rem;font-weight:800}
    .other-detail{margin-top:3px;color:#6f6f79;font-size:.6rem;line-height:1.3}
    .finance-summary{margin-top:11px;padding-top:10px;border-top:1px solid #29292f}
    .summary-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:3px 1px;color:#a6a6af;font-size:.7rem}
    .summary-row span:first-child{font-weight:700}
    .summary-row strong{color:#dddde2;font-size:.76rem;font-weight:850;font-variant-numeric:tabular-nums}
    .summary-row.total{margin-top:4px;padding-top:8px;border-top:1px solid #32323a;color:#9fc4ec}
    .summary-row.total span:first-child,.summary-row.total strong{color:#9fc4ec;font-weight:900}

    .contracted-details{margin-top:14px;border-top:1px solid #29292f}
    .contracted-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 8px;list-style:none;cursor:pointer;color:#d8d8de;font-size:.72rem;font-weight:900;letter-spacing:.065em;text-transform:uppercase}
    .contracted-summary::-webkit-details-marker{display:none}
    .contracted-summary::after{content:"⌄";color:#74747e;font-size:.9rem;transition:transform .16s ease}
    .contracted-details:not([open]) .contracted-summary::after{transform:rotate(-90deg)}
    .contracted-details .finance-wrap{margin-top:0;padding-top:0;border-top:0}
    .replace-pdf-button{margin-left:10px;margin-right:auto;border:0;background:transparent;color:#7898b9;font-size:.62rem;font-weight:800;cursor:pointer;text-transform:none;letter-spacing:0}
    .replace-pdf-button:hover{color:#a9c8e8}
    .contracted-details:not([open]) .replace-pdf-button{display:none}
    .additional-revenue{margin-top:12px;padding-top:12px;border-top:1px solid #29292f}
    .ar-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .ar-title{color:#d8d8de;font-size:.72rem;font-weight:900;letter-spacing:.065em;text-transform:uppercase}
    .ar-paste-zone{min-width:150px;max-width:220px;padding:8px 10px;border:1px dashed #3b526b;border-radius:8px;background:#14191f;color:#8098b1;font-size:.66rem;font-weight:750;text-align:center;cursor:text;outline:none;transition:.15s ease}
    .ar-paste-zone:focus{border-color:#6b9ed2;background:#171f28;color:#a9c8e8}
    .ar-paste-zone.processing{display:none}
    .ar-scan-log{display:none;margin:1px 0 10px;padding:9px 10px;border:1px solid #2c333b;border-radius:8px;background:#11161b;color:#8fa8c1;font:600 .64rem/1.45 "SFMono-Regular",Consolas,monospace}
    .ar-scan-log.visible{display:block}
    .ar-results{display:grid;gap:7px}
    .ar-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid #2f3841;border-left-width:3px;border-radius:8px;background:#15191d}
    .ar-item-label{font-size:.67rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
    .ar-item-value{font-size:.85rem;font-weight:900;color:#8fd0a4;font-variant-numeric:tabular-nums}
    .ar-item.negative .ar-item-value{color:#ee8b8b}
    .ar-total.negative,.ar-total.negative span,.ar-total.negative strong{color:#ee8b8b}
    .ar-item-detail{margin-top:2px;color:#777f88;font-size:.59rem;font-weight:650}
    .ar-item.food{border-left-color:#8dc6f1}.ar-item.food .ar-item-label{color:#9dcef1}
    .ar-item.beverages{border-left-color:#78b6df}.ar-item.beverages .ar-item-label{color:#91c8ec}
    .ar-item.lbw{border-left-color:#ef9dbd}.ar-item.lbw .ar-item-label{color:#f0a9c4}
    .ar-item.na{border-left-color:#7fd5d0}.ar-item.na .ar-item-label{color:#92ddd8}
    .ar-item.gameplay{border-left-color:#8ed39c}.ar-item.gameplay .ar-item-label{color:#9bdbaa}
    .ar-item.retail{border-left-color:#c7a8eb}.ar-item.retail .ar-item-label{color:#cfb6ec}
    .ar-item.labor{border-left-color:#e2c27d}.ar-item.labor .ar-item-label{color:#e8cb8e}
    .ar-item.event-space-rental{border-left-color:#b79de7}.ar-item.event-space-rental .ar-item-label{color:#c3aceb}
    .ar-item.other-fees{border-left-color:#d8ae74}.ar-item.other-fees .ar-item-label{color:#dfb982}
    .ar-item.admin-fee{border-left-color:#a9adb5}.ar-item.admin-fee .ar-item-label{color:#b9bdc5}
    .ar-item.equipment-rental{border-left-color:#7fc5d8}.ar-item.equipment-rental .ar-item-label{color:#93d0df}
    .ar-item.space-rental{border-left-color:#b79de7}.ar-item.space-rental .ar-item-label{color:#c3aceb}
    .ar-item.digital-media{border-left-color:#dd9ee7}.ar-item.digital-media .ar-item-label{color:#e5b2ed}
    .ar-item.unused-fb{border-left-color:#e0b46d}.ar-item.unused-fb .ar-item-label{color:#e6bf82}
    .ar-item.other{border-left-color:#a8abb2}.ar-item.other .ar-item-label{color:#b9bcc3}
    .ar-total{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;padding:12px 2px 2px;border-top:1px solid #303740;color:#9ad6ad;font-weight:900}
    .ar-total span{font-size:.86rem}
    .ar-total strong{font-size:1rem;font-weight:950;font-variant-numeric:tabular-nums}

    .ar-calculation{margin-top:8px;padding-top:9px;border-top:1px solid #303740}
    .ar-calc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 1px;color:#8d939a;font-size:.68rem;font-weight:750}
    .ar-calc-row strong{color:#c9cdd2;font-size:.73rem;font-weight:850;font-variant-numeric:tabular-nums}
    .ar-calc-row.deduction span,.ar-calc-row.deduction strong{color:#d7b481}

    .ar-empty{padding:9px 1px;color:#777f88;font-size:.68rem}
    .ar-no-toast{padding:10px 1px;color:#d98787;font-size:.7rem;font-weight:800}
    .ar-replace{display:none;margin-left:auto;border:0;background:transparent;color:#7898b9;font-size:.62rem;font-weight:800;cursor:pointer}
    .ar-replace.visible{display:inline-block}

    .empty-events{display:none;padding:28px;border:1px dashed #34343b;border-radius:12px;color:#85858f;text-align:center}
    .pdf-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(3,3,5,.76);backdrop-filter:blur(8px)}
    .pdf-modal.open{display:flex}
    .modal-window{position:relative;max-width:94vw;max-height:92vh;display:flex;flex-direction:column;border:1px solid #3b3b43;border-radius:14px;background:#18181c;box-shadow:0 28px 90px rgba(0,0,0,.64);overflow:hidden}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script type="module">

    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const {PDFDocument,rgb,StandardFonts}=window.PDFLib;
    const $=(id)=>document.getElementById(id);
    const pdfInput=$("pdfInput"),toastCsvInput=$("toastCsvInput"),landing=$("landing"),app=$("app"),uploadButton=$("uploadButton"),newFileButton=$("newFileButton"),uploadZone=$("uploadZone"),landingError=$("landingError"),appBrand=$("appBrand"),fileName=$("fileName"),fileMeta=$("fileMeta"),terminal=$("terminal"),status=$("status"),scanProgressBar=$("scanProgressBar"),eventsGrid=$("eventsGrid"),eventCount=$("eventCount"),eventsProgressBar=$("eventsProgressBar"),eventsProgressText=$("eventsProgressText"),portfolioSalesValue=$("portfolioSalesValue"),portfolioSalesDate=$("portfolioSalesDate"),toastUploadButton=$("toastUploadButton"),exportButton=$("exportButton"),emptyEvents=$("emptyEvents"),pdfModal=$("pdfModal"),modalEventName=$("modalEventName"),prevPage=$("prevPage"),nextPage=$("nextPage"),pageCounter=$("pageCounter"),modalClose=$("modalClose"),modalCanvas=$("modalCanvas"),modalLoading=$("modalLoading");
    const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

    let activePreviewPdf=null;
    let activePreviewPage=1;
    let modalRenderTask=null;
    let currentSourceBytes=null;
    let currentSourcePdfJs=null;
    let currentGroups=[];
    let currentToastByEvent=new Map();
    let currentUploadName="Automatic-AR.pdf";
    let portfolioSalesDisplay=0;
    let portfolioSalesAnimation=null;

    uploadButton.addEventListener("click",()=>pdfInput.click());
    newFileButton.addEventListener("click",()=>pdfInput.click());
    exportButton.addEventListener("click",exportAnnotatedPdf);
    toastUploadButton.addEventListener("click",()=>toastCsvInput.click());
    toastCsvInput.addEventListener("change",()=>{
      const file=toastCsvInput.files&&toastCsvInput.files[0];
      if(file)processToastCsv(file);
      toastCsvInput.value="";
    });
    pdfInput.addEventListener("change",()=>{const f=pdfInput.files&&pdfInput.files[0];if(f)processFile(f);pdfInput.value=""});
    appBrand.addEventListener("click",()=>location.reload());
    appBrand.addEventListener("keydown",(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();location.reload()}});

    ["dragenter","dragover"].forEach(n=>uploadZone.addEventListener(n,e=>{e.preventDefault();uploadZone.classList.add("dragging")}));
    ["dragleave","drop"].forEach(n=>uploadZone.addEventListener(n,e=>{e.preventDefault();uploadZone.classList.remove("dragging")}));
    uploadZone.addEventListener("drop",e=>{
      const f=Array.from((e.dataTransfer&&e.dataTransfer.files)||[]).find(x=>x.type==="application/pdf"||x.name.toLowerCase().endsWith(".pdf"));
      if(f)processFile(f);else showError("Please drop a PDF BEO.");
    });

    function showError(msg){landingError.textContent=msg;landingError.classList.add("visible")}
    function clearError(){landingError.textContent="";landingError.classList.remove("visible")}

    async function processFile(file){
      clearError();
      if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf")){showError("ARmatic currently reads PDF BEOs.");return}

      landing.style.display="none";
      app.classList.add("active");
      terminal.replaceChildren();
      eventsGrid.replaceChildren();
      emptyEvents.style.display="none";
      scanProgressBar.style.width="0%";
      currentSourceBytes=null;
      currentSourcePdfJs=null;
      currentGroups=[];
      currentToastByEvent=new Map();
      currentUploadName=file.name;
      exportButton.disabled=true;
      toastUploadButton.disabled=true;
      toastUploadButton.title="";
      eventsProgressBar.style.width="0%";
      eventsProgressText.textContent="0/0";
      if(portfolioSalesAnimation)cancelAnimationFrame(portfolioSalesAnimation);
      portfolioSalesAnimation=null;
      portfolioSalesDisplay=0;
      portfolioSalesValue.textContent=formatMoney(0);
      portfolioSalesDate.textContent="—";
      status.innerHTML='<span class="status-dot"></span> Reading';
      fileName.textContent=file.name;
      fileMeta.textContent=formatBytes(file.size);

      try{
        await terminalMessage("Loading BEO packet…");
        const bytes=new Uint8Array(await file.arrayBuffer());
        const sourcePdfLib=await PDFDocument.load(bytes.slice());
        const sourcePdf=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
        currentSourceBytes=bytes.slice();
        currentSourcePdfJs=sourcePdf;

        fileMeta.textContent=formatBytes(file.size)+" · "+sourcePdf.numPages+(sourcePdf.numPages===1?" page":" pages");
        await terminalMessage("Mapping "+sourcePdf.numPages+" pages and locating event boundaries…");

        const pageRecords=[];
        for(let n=1;n<=sourcePdf.numPages;n++){
          const page=await sourcePdf.getPage(n);
          const lines=await extractLines(page);
          const text=lines.join("\n");
          pageRecords.push({pageNumber:n,lines,text});
          scanProgressBar.style.width=Math.round((n/sourcePdf.numPages)*38)+"%";
        }

        const groups=buildEventGroups(pageRecords);
        currentGroups=groups;
        eventCount.textContent=groups.length+(groups.length===1?" event":" events");
        updateEventsProgress();
        await terminalMessage("Found "+groups.length+(groups.length===1?" event.":" events."),"success");

        if(!groups.length){
          status.innerHTML='<span class="status-dot"></span> Complete';
          scanProgressBar.style.width="100%";
          emptyEvents.style.display="block";
          return;
        }

        for(const group of groups){
          group.parsed=parseEvent(group);

          if(group.parsed.tags.includes("Play It Forward")){
            const zeroComparison={
              items:[{
                label:"Play It Forward",
                actual:0,
                contracted:0,
                additional:0
              }],
              grossTotal:0,
              fbMinimum:0,
              flexAdjusted:false,
              total:0,
              subtotalCheck:{
                pass:true,
                toastTotalNetSales:0,
                toastAdminFee:0,
                toastServiceCharge:0,
                totalAR:0,
                expectedAR:0,
                contractedSubtotal:0,
                arDifference:0,
                discrepancy:0
              },
              toastServiceCharge:0,
              recognizedCount:1,
              autoZero:true
            };

            group.parsed.arProcessed=true;
            group.parsed.arComparison=zeroComparison;
            group.arComparison=zeroComparison;
          }else{
            group.parsed.arProcessed=false;
            group.parsed.arComparison=null;
          }
        }

        groups.sort((a,b)=>{
          const aCard=Number(a.parsed.eventCard);
          const bCard=Number(b.parsed.eventCard);
          const aHas=Number.isFinite(aCard);
          const bHas=Number.isFinite(bCard);

          if(aHas&&bHas)return aCard-bCard;
          if(aHas)return -1;
          if(bHas)return 1;

          return String(a.parsed.eventCard||"").localeCompare(
            String(b.parsed.eventCard||""),
            undefined,
            {numeric:true,sensitivity:"base"}
          );
        });

        currentGroups=groups;
        updateEventsProgress();
        updatePortfolioSales();
        exportButton.disabled=false;

        let index=0;
        for(const group of groups){
          index++;
          const parsed=group.parsed;

          const trimmed=await buildTrimmedEventPdf(sourcePdfLib,group.pageNumbers);
          group.pdfBytes=trimmed;
          group.pdf=await pdfjsLib.getDocument({data:trimmed.slice()}).promise;

          const card=await renderEventCard(group,index,groups.length);
          eventsGrid.appendChild(card);

          const detail=[parsed.name,parsed.date,parsed.time,parsed.guests?parsed.guests+" guests":null].filter(Boolean).join(" · ");
          await terminalMessage(String(index).padStart(2,"0")+"/"+String(groups.length).padStart(2,"0")+"  "+detail,"success");

          scanProgressBar.style.width=(38+Math.round((index/groups.length)*62))+"%";
        }

        status.innerHTML='<span class="status-dot"></span> Complete';
        scanProgressBar.style.width="100%";
        toastUploadButton.disabled=false;
        await terminalMessage("All events separated and analyzed.","success");
      }catch(err){
        console.error(err);
        status.innerHTML='<span class="status-dot"></span> Error';
        await terminalMessage("Could not finish reading this PDF.","muted");
      }
    }

    function buildEventGroups(pageRecords){
      const groups=[];
      let current=null;
      let fallbackCounter=0;

      for(const record of pageRecords){
        const beoMatch=record.text.match(/\bBEO\s*#\s*:?\s*(\d+)/i);
        const beoNumber=beoMatch?beoMatch[1]:null;
        const hasEventHeader=/Event\s*Date\s*:/i.test(record.text);
        const hasMeaningfulText=record.text.trim().length>0;

        if(beoNumber){
          if(!current||current.beoNumber!==beoNumber){
            if(current&&current.records.length)groups.push(current);
            current={beoNumber,records:[],pageNumbers:[]};
          }
          current.records.push(record);
          current.pageNumbers.push(record.pageNumber-1);
          continue;
        }

        if(hasEventHeader&&(!current||current.records.length)){
          if(current&&current.records.length)groups.push(current);
          fallbackCounter++;
          current={beoNumber:"event-"+fallbackCounter,records:[record],pageNumbers:[record.pageNumber-1]};
          continue;
        }

        if(current&&hasMeaningfulText){
          current.records.push(record);
          current.pageNumbers.push(record.pageNumber-1);
        }
      }

      if(current&&current.records.length)groups.push(current);
      return groups;
    }

    async function buildTrimmedEventPdf(sourcePdf,pageNumbers){
      const unique=Array.from(new Set(pageNumbers)).filter(Number.isInteger);
      const out=await PDFDocument.create();
      const copied=await out.copyPages(sourcePdf,unique);
      copied.forEach(page=>out.addPage(page));
      return new Uint8Array(await out.save());
    }

    function parseEvent(group){
      const lines=group.records.flatMap(r=>r.lines);
      const text=group.records.map(r=>r.text).join("\n");
      const fullTitle=extractFullEventTitle(lines);
      const name=clean((fullTitle||"Event").split(" - ")[0]);
      const date=fieldValue(lines,"Event Date");
      const time=fieldValue(lines,"Event Time");
      const guests=fieldValue(lines,"Event Guest Count");
      const eventCard=extractEventCard(lines);
      const tags=detectEventTags(lines,text);
      const financial=extractFinancials(lines,tags);

      return{name,fullTitle:fullTitle||name,date,time,guests,eventCard,beoNumber:group.beoNumber,tags,financial};
    }

    function extractFullEventTitle(lines){
      for(const line of lines){
        const m=line.match(/^(.*?)\s+Event\s*Date\s*:/i);
        if(m){
          const prefix=clean(m[1]);
          if(prefix&&!/^Page\s+\d+\s+of\s+\d+$/i.test(prefix))return prefix;
        }
      }

      for(const line of lines){
        if(/\s+-\s+/.test(line)&&!/:/.test(line)&&!/TOTAL|SUMMARY|BEO/i.test(line))return clean(line);
      }

      return null;
    }

    function fieldValue(lines,label){
      const escaped=esc(label);
      const allLabels="Event Date|Event Day of Week|Event Time|Event Status|Event Guest Count|Event Sales Manager|Event Manager|Account|Contact|Email|Phone|Golf Bays|Bay Validation|Catering Location|Booking Type";
      for(const line of lines){
        const m=line.match(new RegExp(escaped+"\\s*:\\s*(.*?)(?=\\s+(?:"+allLabels+")\\s*:|$)","i"));
        if(m){
          const value=clean(m[1]);
          if(value)return value;
        }
      }
      return null;
    }

    function extractEventCard(lines){
      for(const line of lines){
        const m=line.match(/EVENT\s*CARD\s*#?\s*\/\s*PARTY\s*ID\s*:\s*([A-Za-z0-9-]+)/i);
        if(m)return clean(m[1]);
      }
      return null;
    }

    function isZeroPlayItForwardEvent(lines,text){
      if(!/\bplay\s+it\s+forward\b/i.test(String(text||"")))return false;

      for(let i=0;i<lines.length;i++){
        const line=clean(lines[i]);
        if(!/\bplay\s+it\s+forward\b/i.test(line))continue;

        const nearby=clean(
          line+" "+(lines[i+1]||"")+" "+(lines[i+2]||"")
        );

        const amounts=(nearby.match(/USD\s*-?[\d,.]+/gi)||[])
          .map(parseMoney)
          .filter(value=>value!==null);

        if(
          amounts.length &&
          amounts.every(value=>Math.abs(Number(value)||0)<0.005)
        ){
          return true;
        }
      }

      return false;
    }

    function detectEventTags(lines,text){
      if(isZeroPlayItForwardEvent(lines,text)){
        return["Play It Forward"];
      }

      if(/\bfield\s*trip\b/i.test(text)){
        return["Field Trip"];
      }

      const tags=[];
      let section="";
      let foodItemCount=0;

      for(const rawLine of lines){
        const line=clean(rawLine);
        const sectionName=detectProductSection(line);

        if(sectionName){
          section=sectionName;
          continue;
        }

        if(section==="Food"){
          const foodItem=extractLineItem(line,"Food");
          if(foodItem&&!/\bTOTAL\b/i.test(line)){
            foodItemCount++;
          }
        }

        if(section!=="Food"&&section!=="Beverages")continue;

        if(/\byouth\b/i.test(line)&&!tags.includes("Youth"))tags.push("Youth");
        if(/\bcrowd\s+pleaser\b/i.test(line)&&!tags.includes("Pleaser"))tags.push("Pleaser");
        if(/\bshareable\s+bites?\b|\bfan\s+faves?\b/i.test(line)&&!tags.includes("Faves"))tags.push("Faves");
        if(/\bflex\b|\bmulti[- ]?bay\s+flex\b/i.test(line)&&!tags.includes("Flex"))tags.push("Flex");
        if(/\bbuffet\b/i.test(line)&&!tags.includes("Buffet"))tags.push("Buffet");
      }

      if(foodItemCount>=5&&!tags.includes("Buffet")){
        tags.push("Buffet");
      }

      const preferred=["Youth","Buffet","Flex","Pleaser","Faves"];
      tags.sort((a,b)=>preferred.indexOf(a)-preferred.indexOf(b));

      return tags.length?tags:["Other"];
    }

    function detectProductSection(line){
      const normalized=clean(line).toLowerCase();

      if(normalized==="food")return"Food";
      if(normalized==="beverages"||normalized==="beverage")return"Beverages";
      if(normalized==="gameplay"||normalized==="game play"||normalized==="game enhancement")return"Gameplay";
      if(normalized==="retail")return"Retail";
      if(normalized==="labor"||normalized==="labour")return"Labor";
      if(normalized==="asset"||normalized==="assets")return"Asset";
      if(normalized==="limited inventory"||normalized==="equipment rental"||normalized==="event equipment rental")return"Equipment Rental";
      if(normalized==="event space rental"||normalized==="space rental")return"Space Rental";
      if(normalized==="digital media"||normalized==="marketing partnerships")return"Digital Media";
      if(normalized==="charges & fees"||normalized==="charges and fees")return"Charges & Fees";
      if(normalized==="incentive"||normalized==="incentives")return"Incentives";

      return null;
    }

    function extractLineItem(line,section){
      const qtyPrice=line.match(/\b(\d+(?:\.\d+)?)\s+USD\s*(-?[\d,.]+)/i);
      if(!qtyPrice)return null;

      const amounts=line.match(/USD\s*-?[\d,.]+/gi)||[];
      const quantity=Number(qtyPrice[1]);
      const unitPrice=parseMoney(qtyPrice[2]);

      // One money value on a product row is just the unit price.
      // A true line total is only present when there is a second money value.
      const printedTotal=amounts.length>=2
        ? parseMoney(amounts[amounts.length-1])
        : null;

      if(!Number.isFinite(quantity)||unitPrice===null)return null;

      return{
        line,
        section,
        quantity,
        unitPrice,
        computedTotal:quantity*unitPrice,
        printedTotal
      };
    }

    function extractYouthFoodTotal(lines){
      let section="";
      let youthContext=0;
      let total=0;

      for(let i=0;i<lines.length;i++){
        const line=clean(lines[i]);
        const nextSection=detectProductSection(line);

        if(nextSection){
          section=nextSection;
          youthContext=0;
          continue;
        }

        if(section!=="Food"&&section!=="Beverages"){
          youthContext=0;
          continue;
        }

        if(/\byouth\b/i.test(line)){
          youthContext=3;
        }else if(youthContext>0){
          youthContext--;
        }

        if(youthContext<=0)continue;

        const firstUsdIndex=line.search(/USD\s*[\d,.]+/i);
        if(firstUsdIndex<0)continue;

        const unitMatch=line.slice(firstUsdIndex).match(/^USD\s*([\d,.]+)/i);
        if(!unitMatch)continue;

        const prefix=line.slice(0,firstUsdIndex);
        const numberMatches=[...prefix.matchAll(/(?:^|\s)(\d+(?:\.\d+)?)(?=\s|$)/g)];
        if(!numberMatches.length)continue;

        const quantity=Number(numberMatches[numberMatches.length-1][1]);
        const unitPrice=parseMoney(unitMatch[1]);

        if(!Number.isFinite(quantity)||unitPrice===null)continue;

        total+=quantity*unitPrice;
        youthContext=0;
      }

      return total;
    }

    function inferIncentiveTarget(text){
      return incentiveTargetFromText(text)||"Gameplay";
    }

    function incentiveTargetFromText(text){
      const x=String(text||"").toLowerCase();

      if(/\broom\s+rental\b|\bspace\s+rental\b/.test(x))return"Space Rental";
      if(/\bequipment\b|\blimited inventory\b/.test(x))return"Equipment Rental";
      if(/\bdigital\s+media\b|\bmarketing\b/.test(x))return"Digital Media";
      if(/\blabor\b|\blabour\b|\bstaff\b/.test(x))return"Labor";
      if(/\bretail\b|\bmerch/.test(x))return"Retail";
      if(/\bbeverage\b|\bbar\b|\bdrink\b|\balcohol\b/.test(x))return"Beverages";
      if(/\bfood\b|\bcatering\b/.test(x))return"Food";
      if(/\bgame\s*play\b|\bgameplay\b|\btopgolf\b|\bplay\b|\bgame\b/.test(x))return"Gameplay";

      return null;
    }

    function extractIncentiveRecords(lines){
      const records=[];
      let inIncentives=false;
      let pendingTarget=null;

      for(let i=0;i<lines.length;i++){
        const line=clean(lines[i]);

        if(!inIncentives){
          if(/^Incentives?$/i.test(line)){
            inIncentives=true;
          }
          continue;
        }

        if(
          /^(?:BILLING SUMMARY|PAYMENT SUMMARY|EVENT NOTES|IMPORTANT REMINDERS|INTERNAL NOTES)\b/i.test(line)
        ){
          break;
        }

        // The section total is only a reconciliation number.
        // It never belongs to a single contracted category.
        if(/\bIncentives?\s+TOTAL\b/i.test(line)){
          break;
        }

        const explicitTarget=incentiveTargetFromText(line);
        if(explicitTarget){
          pendingTarget=explicitTarget;
        }

        const negativeAmounts=[
          ...line.matchAll(/USD\s*-\s*([\d,.]+)/gi)
        ].map(match=>Math.abs(parseMoney(match[1])||0))
         .filter(amount=>amount>0.004);

        if(!negativeAmounts.length)continue;

        // The far-right / last negative USD value on this extracted row
        // is the incentive row TOTAL. Unit discounts can appear before it.
        const amount=negativeAmounts[negativeAmounts.length-1];
        const target=explicitTarget||pendingTarget;

        if(!target)continue;

        records.push({target,amount});
        pendingTarget=null;
      }

      return records;
    }

    function isEventNABeverageRow(text){
      return /\bevent\s+n\s*\/?\s*a(?:\s+(?:bev|beverage|beverages))?\b/i.test(String(text||""));
    }

    function isEventLBWRow(text){
      return /\bevent\s+(?:l\s*\/?\s*b\s*\/?\s*w|lbw)\b/i.test(String(text||""));
    }

    function isFlexMinimumText(text){
      const x=String(text||"");

      return(
        /\bf\s*&\s*b\s+minimum\b/i.test(x) ||
        /\bfood\s*&\s*beverage\s+minimum\b/i.test(x) ||
        /\bfood\s+and\s+beverage\s+minimum\b/i.test(x) ||
        /\bflex\b[^]{0,90}\bminimum\b/i.test(x) ||
        /\bminimum\b[^]{0,90}\bflex\b/i.test(x)
      );
    }

    function isFlexMinimumContextText(text){
      const x=String(text||"");

      return(
        /\bflex\b/i.test(x) &&
        (
          /\bf\s*&\s*b\b/i.test(x) ||
          /\bfood\s*&\s*beverage\b/i.test(x) ||
          /\bfood\s+and\s+beverage\b/i.test(x)
        )
      );
    }

    function extractFlexMinimumFromRawLines(lines){
      let section="";
      let total=0;
      const seen=new Set();

      for(let i=0;i<lines.length;i++){
        const line=clean(lines[i]);
        const nextSection=detectProductSection(line);

        if(nextSection){
          section=nextSection;
          continue;
        }

        if(section!=="Beverages"&&section!=="Food")continue;

        const currentHasMinimum=/\bminimum\b/i.test(line);
        const next=clean(lines[i+1]||"");
        const next2=clean(lines[i+2]||"");

        let candidate=line;

        if(currentHasMinimum){
          if(!/USD\s*-?[\d,.]+/i.test(candidate)){
            candidate=clean(candidate+" "+next);
          }
          if(!/USD\s*-?[\d,.]+/i.test(candidate)){
            candidate=clean(candidate+" "+next2);
          }
        }else{
          continue;
        }

        const amounts=(candidate.match(/USD\s*-?[\d,.]+/gi)||[])
          .map(parseMoney)
          .filter(value=>value!==null&&Math.abs(value)>0.004);

        if(!amounts.length)continue;

        const amount=Math.abs(amounts[amounts.length-1]);
        const key=i+"|"+amount.toFixed(2);

        if(seen.has(key))continue;
        seen.add(key);
        total+=amount;
      }

      return total;
    }

    function getFlexBeverageBuckets(lineItems,lines,tags){
      if(!tags.includes("Flex")){
        return null;
      }

      let minimum=0;
      let na=0;

      for(const item of lineItems){
        if(item.section!=="Beverages"&&item.section!=="Food")continue;

        const isMinimum=
          Boolean(item.isFlexMinimum) ||
          isFlexMinimumText(item.line) ||
          /\bminimum\b/i.test(item.line);

        const rowTotal=item.printedTotal!==null
          ? Math.max(0,Number(item.printedTotal)||0)
          : 0;

        if(isMinimum){
          minimum+=rowTotal;
          continue;
        }

        if(
          item.section==="Beverages" &&
          isExplicitFlexNABeverageRow(item.line)
        ){
          na+=rowTotal;
        }
      }

      const rawMinimum=extractFlexMinimumFromRawLines(lines);

      if(rawMinimum>0.004){
        minimum=rawMinimum;
      }

      return{minimum,na};
    }

    function isExplicitFlexNABeverageRow(text){
      const x=String(text||"");

      return(
        /\bevent\s+n\s*\/?\s*a\s+(?:bev|beverage|beverages)\b/i.test(x) ||
        /\b(?:n\s*\/?\s*a|na)\s+(?:bev|beverage|beverages)\b/i.test(x) ||
        /\bnon[- ]?alcoholic\b/i.test(x) ||
        /\bfountain\s+soft\s+drinks?\b/i.test(x) ||
        /\bsoft\s+drinks?\b/i.test(x) ||
        /\blemonade\b/i.test(x)
      );
    }

    function hasNABeverageText(text){
      return(
        /\bn\s*\/\s*a\b/i.test(text) ||
        /\bna\s+(?:bev|beverage|beverages)\b/i.test(text) ||
        /\bnon[- ]?alcoholic\b/i.test(text)
      );
    }

    function isCoachInstructionText(text){
      return /\bcoach\b|\binstruction\b|\binstructional\b/i.test(String(text||""));
    }

    function extractFinancials(lines,tags=[]){
      const categories={
        Food:0,
        Beverages:0,
        NA:0,
        Gameplay:0,
        Retail:0,
        Labor:0,
        "Equipment Rental":0,
        "Space Rental":0,
        "Digital Media":0,
        Coach:0,
        "Play It Forward":0,
        "F&B Minimum":0,
        "Other Fees":0
      };
      const detected={};
      const otherBreakdown=[];
      const lineItems=[];
      const incentiveRecords=extractIncentiveRecords(lines);
      let section="";
      let assetHasLeaderboard=false;
      let pendingMinimumContext="";
      let pendingMinimumLines=0;
      let voluntaryGratuity=0;
      let chargesFeesTotal=0;

      for(let lineIndex=0;lineIndex<lines.length;lineIndex++){
        const line=clean(lines[lineIndex]);
        const nextSection=detectProductSection(line);

        if(nextSection){
          section=nextSection;
          pendingMinimumContext="";
          pendingMinimumLines=0;
          if(section==="Asset")assetHasLeaderboard=false;
          continue;
        }

        if(section==="Asset"&&/\blive\s+leaderboard\b/i.test(line)){
          assetHasLeaderboard=true;
        }

        if(
          section==="Charges & Fees"&&
          /\bvoluntary\s+(?:gratuity|tip)\b/i.test(line)
        ){
          const gratuityItem=extractLineItem(line,section);

          if(gratuityItem){
            const gratuityAmount=
              gratuityItem.printedTotal!==null
                ? Math.max(0,Number(gratuityItem.printedTotal)||0)
                : Math.max(0,Number(gratuityItem.computedTotal)||0);

            voluntaryGratuity+=gratuityAmount;
          }
        }

        const totalMatch=line.match(/^(.+?)\s+TOTAL\s*:\s*USD\s*(-?[\d,.]+)/i);

        if(totalMatch){
          const rawLabel=clean(totalMatch[1]);
          const rawAmount=parseMoney(totalMatch[2]);

          if(rawAmount!==null){
            const amount=Math.abs(rawAmount);

            if(section==="Incentives"||/\bincentives?\b/i.test(rawLabel)){
              continue;
            }

            if(section==="Charges & Fees"){
              chargesFeesTotal=amount;
              continue;
            }

            let category;

            if(section==="Asset"&&assetHasLeaderboard){
              category="Gameplay";
            }else if(section==="Equipment Rental"){
              category="Equipment Rental";
            }else if(section==="Labor"){
              category="Labor";
            }else if(section==="Space Rental"){
              category="Space Rental";
            }else if(section==="Digital Media"){
              category="Digital Media";
            }else{
              category=mapRevenueCategory(rawLabel);
            }

            categories[category]=(categories[category]||0)+amount;
            detected[category]=true;

            if(category==="Other Fees"){
              otherBreakdown.push(rawLabel+" "+formatMoney(amount));
            }
          }

          continue;
        }

        if(section!=="Incentives"){
          const item=extractLineItem(line,section);
          const revenueSection=section==="Beverages"||section==="Food";

          if(item){
            if(revenueSection&&pendingMinimumContext){
              const combined=clean(pendingMinimumContext+" "+line);
              item.line=combined;

              if(
                isFlexMinimumText(combined) ||
                (tags.includes("Flex")&&/\bminimum\b/i.test(combined))
              ){
                item.isFlexMinimum=true;
              }

              pendingMinimumContext="";
              pendingMinimumLines=0;
            }else if(
              revenueSection&&
              (
                isFlexMinimumText(line) ||
                (tags.includes("Flex")&&/\bminimum\b/i.test(line))
              )
            ){
              item.isFlexMinimum=true;
            }

            lineItems.push(item);
          }else if(
            revenueSection&&
            (
              isFlexMinimumText(line) ||
              isFlexMinimumContextText(line) ||
              (tags.includes("Flex")&&/\bminimum\b/i.test(line))
            )
          ){
            pendingMinimumContext=line;
            pendingMinimumLines=0;
          }else if(revenueSection&&pendingMinimumContext&&pendingMinimumLines<2){
            pendingMinimumContext=clean(pendingMinimumContext+" "+line);
            pendingMinimumLines++;
          }else if(pendingMinimumContext){
            pendingMinimumContext="";
            pendingMinimumLines=0;
          }
        }
      }

      for(const rawLine of lines){
        const line=clean(rawLine);
        const m=line.match(
          /^(Food|Beverages?|Gameplay|Game\\s*Enhancement|Retail|Labor|Limited\\s+Inventory|Equipment\\s+Rental|Event\\s+Space\\s+Rental|Space\\s+Rental|Digital\\s+Media)\\s+TOTAL\\s*:\\s*USD\\s*(-?[\\d,.]+)/i
        );

        if(!m)continue;

        const rawLabel=clean(m[1]);
        const amount=Math.abs(parseMoney(m[2])||0);
        const category=mapRevenueCategory(rawLabel);

        categories[category]=amount;
        detected[category]=true;
      }

      const contractedBeverageSplit={
        foundNA:false,
        foundLBW:false,
        na:0,
        lbw:0
      };

      for(const item of lineItems){
        if(item.section!=="Beverages")continue;

        const isMinimumRow=
          Boolean(item.isFlexMinimum) ||
          isFlexMinimumText(item.line) ||
          (tags.includes("Flex")&&/\bminimum\b/i.test(item.line));

        // Minimum always wins over N/A/LBW Toast item labels.
        if(isMinimumRow)continue;

        const isToastNA=
          tags.includes("Flex")
            ? isExplicitFlexNABeverageRow(item.line)
            : isEventNABeverageRow(item.line);
        const isToastLBW=isEventLBWRow(item.line);

        if(!isToastNA&&!isToastLBW)continue;

        // For these explicitly labeled Toast rows, only the far-right printed
        // row total is contracted revenue. A missing printed total means $0.
        const rowTotal=item.printedTotal!==null
          ? Math.max(0,Number(item.printedTotal)||0)
          : 0;

        if(isToastNA){
          contractedBeverageSplit.foundNA=true;
          contractedBeverageSplit.na+=rowTotal;
        }

        if(isToastLBW){
          contractedBeverageSplit.foundLBW=true;
          contractedBeverageSplit.lbw+=rowTotal;
        }
      }

      const splitFromParent={Food:0,Beverages:0};
      let youthFood=0;

      for(const item of lineItems){
        const parent=item.section==="Food"?"Food":item.section==="Beverages"?"Beverages":null;
        if(!parent)continue;

        const normalAmount=
          item.printedTotal!==null&&item.printedTotal>0
            ? item.printedTotal
            : item.computedTotal;

        const isYouth=/\byouth\b/i.test(item.line);
        const isMinimum=
          Boolean(item.isFlexMinimum) ||
          isFlexMinimumText(item.line) ||
          (tags.includes("Flex")&&/\bminimum\b/i.test(item.line));
        const isNA=!isMinimum&&hasNABeverageText(item.line);

        if(isYouth){
          youthFood+=item.computedTotal;
          if(item.printedTotal!==null&&item.printedTotal>0){
            splitFromParent[parent]+=item.printedTotal;
          }
          continue;
        }

        if(isMinimum){
          categories["F&B Minimum"]+=normalAmount;
          detected["F&B Minimum"]=true;

          if(item.printedTotal!==null&&item.printedTotal>0){
            splitFromParent[parent]+=item.printedTotal;
          }
          continue;
        }

        if(isNA){
          const naAmount=
            item.printedTotal!==null&&item.printedTotal>0
              ? item.printedTotal
              : 0;

          if(naAmount>0.004){
            categories.NA+=naAmount;
            detected.NA=true;
            splitFromParent[parent]+=naAmount;
          }
        }
      }

      if(tags.includes("Youth")){
        const robustYouthFood=extractYouthFoodTotal(lines);

        if(robustYouthFood>0){
          categories.Food=robustYouthFood;
          detected.Food=true;
          categories.Beverages=0;
          delete detected.Beverages;
          categories.NA=0;
          delete detected.NA;
        }else if(youthFood>0){
          categories.Food=youthFood;
          detected.Food=true;
        }
      }else if(youthFood>0){
        categories.Food+=youthFood;
        detected.Food=true;
      }

      for(const parent of ["Food","Beverages"]){
        if(tags.includes("Youth"))break;

        if(splitFromParent[parent]>0){
          categories[parent]=Math.max(0,categories[parent]-splitFromParent[parent]);

          if(categories[parent]<0.005){
            categories[parent]=0;
            delete detected[parent];
          }
        }
      }

      if(!tags.includes("Youth")){
        if(contractedBeverageSplit.foundNA){
          categories.NA=contractedBeverageSplit.na;

          if(categories.NA>0.004){
            detected.NA=true;
          }else{
            delete detected.NA;
          }
        }

        if(contractedBeverageSplit.foundLBW){
          categories.Beverages=contractedBeverageSplit.lbw;

          if(categories.Beverages>0.004){
            detected.Beverages=true;
          }else{
            delete detected.Beverages;
          }
        }
      }

      let coachTotal=0;

      for(const item of lineItems){
        if(item.section!=="Equipment Rental")continue;
        if(!isCoachInstructionText(item.line))continue;

        const amount=
          item.printedTotal!==null
            ? Math.max(0,Number(item.printedTotal)||0)
            : Math.max(0,Number(item.computedTotal)||0);

        coachTotal+=amount;
      }

      if(coachTotal>0.004){
        categories.Coach+=coachTotal;
        detected.Coach=true;

        categories["Equipment Rental"]=Math.max(
          0,
          Number(categories["Equipment Rental"]||0)-coachTotal
        );

        if(categories["Equipment Rental"]<0.005){
          categories["Equipment Rental"]=0;
          delete detected["Equipment Rental"];
        }
      }

      const flexBuckets=getFlexBeverageBuckets(lineItems,lines,tags);

      if(flexBuckets){
        categories["F&B Minimum"]=flexBuckets.minimum;
        categories.NA=flexBuckets.na;

        if(categories["F&B Minimum"]>0.004){
          detected["F&B Minimum"]=true;
        }else{
          delete detected["F&B Minimum"];
        }

        if(categories.NA>0.004){
          detected.NA=true;
        }else{
          delete detected.NA;
        }
      }

      if(chargesFeesTotal>0.004){
        const remainingCharges=Math.max(0,chargesFeesTotal-voluntaryGratuity);

        if(remainingCharges>0.004){
          categories["Other Fees"]+=remainingCharges;
          detected["Other Fees"]=true;
          otherBreakdown.push("Charges & Fees "+formatMoney(remainingCharges));
        }
      }

      if(tags.includes("Play It Forward")){
        categories["Play It Forward"]=0;
        detected["Play It Forward"]=true;
      }

      const originalCategories={...categories};
      const incentiveAdjustments={};

      for(const incentive of incentiveRecords){
        const target=incentive.target||"Gameplay";
        const amount=Math.abs(Number(incentive.amount||0));
        if(amount<0.005)continue;

        const current=Number(categories[target]||0);
        if(current<=0)continue;

        incentiveAdjustments[target]=(incentiveAdjustments[target]||0)+amount;
        categories[target]=Math.max(0,current-amount);
        detected[target]=true;
      }

      const billingHeaderIndex=lines.findIndex(
        l=>/^\s*Subtotal\s+Taxes\s+Service Charge\s+Admin Fee\s+Total Charges\s*$/i.test(l)
      );
      let subtotal=null,taxes=null,serviceCharge=null,adminFee=null,totalCharges=null;

      if(billingHeaderIndex>=0&&lines[billingHeaderIndex+1]){
        const amounts=(lines[billingHeaderIndex+1].match(/USD\s*-?[\d,.]+/gi)||[]).map(parseMoney);
        subtotal=amounts[0]??null;
        taxes=amounts[1]??null;
        serviceCharge=amounts[2]??null;
        adminFee=amounts[3]??null;
        totalCharges=amounts[4]??null;
      }

      if(voluntaryGratuity>0.004){
        const existingServiceCharge=Number(serviceCharge||0);
        const baseTotal=
          Number(subtotal||0)+
          Number(taxes||0)+
          Number(adminFee||0)+
          existingServiceCharge;

        const gratuityExplainsTotal=
          totalCharges!==null&&
          Math.abs(
            Number(totalCharges)-baseTotal-voluntaryGratuity
          )<=0.03;

        if(existingServiceCharge<0.005||gratuityExplainsTotal){
          serviceCharge=existingServiceCharge+voluntaryGratuity;
        }
      }

      let payments=null,outstanding=null;

      for(const line of lines){
        let m=line.match(/^Total Payments\s+USD\s*(-?[\d,.]+)/i);
        if(m)payments=parseMoney(m[1]);

        m=line.match(/^Total Outstanding Balance\s+USD\s*(-?[\d,.]+)/i);
        if(m)outstanding=parseMoney(m[1]);
      }

      return{
        categories,
        originalCategories,
        incentiveAdjustments,
        detected,
        otherBreakdown,
        subtotal,
        taxes,
        serviceCharge,
        adminFee,
        totalCharges,
        payments,
        outstanding
      };
    }

    function mapRevenueCategory(label){
      const x=label.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();

      if(/\bnon alcoholic\b|\bna beverage\b|\bna beverages\b/.test(x))return"NA";
      if(/\bequipment rental\b|\blimited inventory\b/.test(x))return"Equipment Rental";
      if(/\bevent space rental\b|\bspace rental\b/.test(x))return"Space Rental";
      if(/\bdigital media\b|\bmarketing partnerships?\b/.test(x))return"Digital Media";
      if(/\bfood\b/.test(x)&&!/\bbeverages?\b/.test(x))return"Food";
      if(/\bbeverages?\b|\bbar\b|\balcohol\b/.test(x))return"Beverages";
      if(/\bgame ?play\b|\bgame enhancement\b|\bgame\b/.test(x))return"Gameplay";
      if(/\bretail\b|\bmerch/.test(x))return"Retail";
      if(/\blabor\b|\blabour\b|\bstaff\b/.test(x))return"Labor";
      return"Other Fees";
    }

    async function readPdfRecords(pdf){
      const records=[];

      for(let n=1;n<=pdf.numPages;n++){
        const page=await pdf.getPage(n);
        const lines=await extractLines(page);
        records.push({
          pageNumber:n,
          lines,
          text:lines.join("\n")
        });
      }

      return records;
    }

    async function makeEvenPdfBytes(bytes){
      const doc=await PDFDocument.load(bytes.slice());

      if(doc.getPageCount()%2===1){
        const last=doc.getPage(doc.getPageCount()-1);
        doc.addPage([last.getWidth(),last.getHeight()]);
      }

      return new Uint8Array(await doc.save());
    }

    function makeZeroPlayItForwardComparison(){
      return{
        items:[{
          label:"Play It Forward",
          actual:0,
          contracted:0,
          additional:0
        }],
        grossTotal:0,
        fbMinimum:0,
        flexAdjusted:false,
        total:0,
        subtotalCheck:{
          pass:true,
          toastTotalNetSales:0,
          toastAdminFee:0,
          toastServiceCharge:0,
          totalAR:0,
          expectedAR:0,
          contractedSubtotal:0,
          arDifference:0,
          discrepancy:0
        },
        toastServiceCharge:0,
        recognizedCount:1,
        autoZero:true
      };
    }

    async function replaceEventPdf(group,file){
      if(!file)return;
      if(
        file.type!=="application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
      ){
        return;
      }

      try{
        const rawBytes=new Uint8Array(await file.arrayBuffer());
        const sourcePdf=await pdfjsLib.getDocument({
          data:rawBytes.slice()
        }).promise;

        const records=await readPdfRecords(sourcePdf);
        const evenBytes=await makeEvenPdfBytes(rawBytes);
        const evenPdf=await pdfjsLib.getDocument({
          data:evenBytes.slice()
        }).promise;

        const previousCard=group.cardElement;
        const previousToast=group.toastData||null;

        group.records=records;
        group.pageNumbers=records.map((_,index)=>index);
        group.pdfBytes=evenBytes;
        group.pdf=evenPdf;
        group.replacedPdf=true;

        const beoMatch=records
          .map(record=>record.text)
          .join("\n")
          .match(/\bBEO\s*#\s*:?\s*(\d+)/i);

        if(beoMatch){
          group.beoNumber=beoMatch[1];
        }

        group.parsed=parseEvent(group);

        let toastData=previousToast;
        const csvRows=currentToastByEvent.get(
          String(group.parsed.eventCard||"").trim()
        );

        if(csvRows?.length){
          toastData=makeToastDataFromCsvRows(csvRows);
        }

        if(group.parsed.tags.includes("Play It Forward")){
          const zeroComparison=makeZeroPlayItForwardComparison();
          group.toastData=null;
          group.parsed.arProcessed=true;
          group.parsed.arComparison=zeroComparison;
          group.arComparison=zeroComparison;
        }else if(toastData){
          const comparison=compareAdditionalRevenue(
            toastData,
            group.parsed.financial,
            group.parsed
          );

          group.toastData=toastData;
          group.parsed.arProcessed=true;
          group.parsed.arComparison=comparison;
          group.arComparison=comparison;
        }else{
          group.toastData=null;
          group.parsed.arProcessed=false;
          group.parsed.arComparison=null;
          group.arComparison=null;
        }

        const index=currentGroups.indexOf(group);
        const newCard=await renderEventCard(
          group,
          index>=0?index+1:1,
          currentGroups.length
        );

        if(previousCard&&previousCard.isConnected){
          previousCard.replaceWith(newCard);
        }

        if(group.toastData&&group.ui){
          group.ui.contracted.open=false;
        }else if(
          currentToastByEvent.size>0 &&
          !group.parsed.tags.includes("Play It Forward")
        ){
          showNoToastData(group);
        }

        // After replacing an event PDF, keep the Toast paste action compact
        // like the other completed cards instead of showing the large paste box.
        if(
          group.ui &&
          !group.parsed.tags.includes("Play It Forward")
        ){
          group.ui.pasteZone.style.display="none";
          group.ui.replaceButton.classList.add("visible");
        }

        updateEventsProgress();
        updatePortfolioSales();
      }catch(error){
        console.error("Event PDF replacement failed:",error);
      }
    }

    async function renderEventCard(group,index,total){
      const p=group.parsed,f=p.financial;
      const card=document.createElement("article");
      card.className="event-card";

      const preview=document.createElement("div");
      preview.className="event-preview";
      const canvas=document.createElement("canvas");
      preview.appendChild(canvas);
      await renderThumbnail(group.pdf,canvas);
