    function parseCsvText(text){
      const rows=[];
      let row=[];
      let field="";
      let quoted=false;
      const source=String(text||"");

      for(let i=0;i<source.length;i++){
        const ch=source[i];

        if(quoted){
          if(ch==='"'&&source[i+1]==='"'){
            field+='"';
            i++;
          }else if(ch==='"'){
            quoted=false;
          }else{
            field+=ch;
          }
          continue;
        }

        if(ch==='"'){
          quoted=true;
        }else if(ch===","){
          row.push(field);
          field="";
        }else if(ch==="\n"){
          row.push(field.replace(/\r$/,""));
          rows.push(row);
          row=[];
          field="";
        }else{
          field+=ch;
        }
      }

      if(field.length||row.length){
        row.push(field.replace(/\r$/,""));
        rows.push(row);
      }

      return rows.filter(row=>row.some(cell=>String(cell||"").trim()!==""));
    }

    function csvNumber(value){
      const cleaned=String(value??"")
        .trim()
        .replace(/[$,]/g,"")
        .replace(/^\((.*)\)$/,"-$1");

      const number=Number(cleaned);
      return Number.isFinite(number)?number:0;
    }

    function toastCsvEventCard(server){
      const match=String(server||"").trim().match(/^Event\s+(\d+)\s+Card$/i);
      if(!match)return null;

      const number=Number(match[1]);
      if(!Number.isFinite(number))return null;

      return String(number<1000?1000+number:number);
    }

    function isToastVoluntaryTipCategory(category){
      const compact=String(category||"")
        .toLowerCase()
        .normalize("NFKD")
        .replace(/[^a-z0-9]+/g,"");

      return(
        compact==="voluntarytip" ||
        compact==="voluntarygratuity" ||
        compact==="gratuity"
      );
    }

    function mapToastCsvCategory(category){
      const x=String(category||"")
        .toLowerCase()
        .replace(/[–—]/g,"-")
        .replace(/\s+/g," ")
        .trim();

      if(x==="beer"||x==="liquor"||x==="wine")return"LBW";
      if(x==="n/a bev"||x==="na bev"||x==="non-alcoholic"||x==="non alcoholic")return"NA";
      if(x==="food")return"Food";
      if(x==="game play"||x==="gameplay")return"Gameplay";
      if(x==="event drink package"||x==="drink package"||x==="beverage package")return"Beverages";
      if(x==="admin fee")return"Admin Fee";
      if(x==="service charge")return"Service Charge";
      if(isToastVoluntaryTipCategory(category))return"Voluntary Tip";
      if(x==="event - space rental"||x==="event space rental"||x==="space rental")return"Space Rental";
      if(x==="event - equipment rental"||x==="event equipment rental"||x==="equipment rental")return"Equipment Rental";
      if(x==="event - labor"||x==="event labor"||x==="labor"||x==="labour")return"Labor";
      if(x==="marketing partnerships"||x==="marketing partnership"||x==="digital media")return"Digital Media";
      if(
        /^events?\s*-\s*fees?$/.test(x) ||
        x==="events fees" ||
        x==="event fees" ||
        x==="fees" ||
        x==="fee"
      )return"Fees";
      if(x==="retail")return"Retail";
      if(x==="coach"||x==="instruction"||x==="instructional")return"Coach";
      if(x==="club rental")return"Other Fees";

      return"Other Fees";
    }

    function makeToastDataFromCsvRows(rows){
      const totals={
        Food:0,
        Beverages:0,
        LBW:0,
        NA:0,
        Gameplay:0,
        Retail:0,
        Labor:0,
        "Equipment Rental":0,
        "Space Rental":0,
        "Digital Media":0,
        Coach:0,
        Fees:0,
        "Other Fees":0,
        "Voluntary Tip":0,
        "Service Charge":0,
        "Admin Fee":0
      };
      const recognized=new Set();
      let totalNetSales=0;

      for(const row of rows){
        const net=csvNumber(row.netSales);
        totalNetSales+=net;

        const mapped=mapToastCsvCategory(row.category);
        if(!mapped)continue;

        totals[mapped]=(totals[mapped]||0)+net;
        recognized.add(mapped);

      }

      totals.__recognized=recognized;
      totals.__totalNetSales=totalNetSales;
      totals.__source="csv";
      return totals;
    }

    async function processToastCsv(file){
      if(!currentGroups.length)return;

      const oldText=toastUploadButton.textContent;
      toastUploadButton.disabled=true;
      toastUploadButton.textContent="Reading…";

      try{
        const text=await file.text();
        const rows=parseCsvText(text);

        if(rows.length<2){
          throw new Error("Toast CSV is empty");
        }

        const headers=rows[0].map(value=>String(value||"").trim().toLowerCase());
        const indexOfHeader=(...names)=>{
          for(const name of names){
            const index=headers.indexOf(name.toLowerCase());
            if(index>=0)return index;
          }
          return-1;
        };

        const categoryIndex=indexOfHeader("Sales Category");
        const serverIndex=indexOfHeader("Server");
        const netIndex=indexOfHeader("Net Sales");

        if(categoryIndex<0||serverIndex<0||netIndex<0){
          throw new Error("Toast CSV needs Sales Category, Server, and Net Sales columns");
        }

        const byEvent=new Map();
        let ignoredRows=0;
        let eventRows=0;

        for(let i=1;i<rows.length;i++){
          const row=rows[i];
          const eventCard=toastCsvEventCard(row[serverIndex]);

          if(!eventCard){
            ignoredRows++;
            continue;
          }

          eventRows++;

          if(!byEvent.has(eventCard)){
            byEvent.set(eventCard,[]);
          }

          byEvent.get(eventCard).push({
            category:row[categoryIndex],
            netSales:row[netIndex]
          });
        }

        currentToastByEvent=byEvent;

        let matched=0;

        for(const group of currentGroups){
          const parsed=group.parsed;
          const card=String(parsed?.eventCard||"").trim();
          const eventSales=byEvent.get(card);

          if(!eventSales?.length){
            if(parsed?.tags?.includes("Play It Forward")){
              // Known $0 Play It Forward events are valid without Toast rows.
              if(parsed.arComparison){
                renderAdditionalRevenue(group.ui.arResults,parsed.arComparison);
                updateSubtotalCheck(group.ui.subtotalCheck,parsed.arComparison);
              }
            }else{
              showNoToastData(group);
            }
            continue;
          }

          const toast=makeToastDataFromCsvRows(eventSales);
          const comparison=compareAdditionalRevenue(
            toast,
            parsed.financial,
            parsed
          );

          group.toastData=toast;
          parsed.arProcessed=true;
          parsed.arComparison=comparison;
          group.arComparison=comparison;

          const ui=group.ui;

          if(ui){
            renderAdditionalRevenue(ui.arResults,comparison);
            updateSubtotalCheck(ui.subtotalCheck,comparison);

            ui.contracted.open=false;
            ui.scanLog.replaceChildren();
            ui.scanLog.classList.remove("visible");
            ui.pasteZone.classList.remove("processing");
            ui.pasteZone.style.display="none";
            ui.replaceButton.classList.add("visible");
          }

          matched++;
        }

        updateEventsProgress();
        updatePortfolioSales();

        toastUploadButton.title=
          file.name+" · "+matched+" matched event"+(matched===1?"":"s");

        await terminalMessage(
          "Toast CSV matched "+matched+" of "+currentGroups.length+
          " BEO events · "+eventRows+" event sales rows used · "+
          ignoredRows+" non-event server rows ignored.",
          matched?"success":"muted"
        );

        if(!matched){
          alert("No Toast Event ## Card servers matched the BEO event cards in this PDF.");
        }
      }catch(error){
        console.error("Toast CSV import failed:",error);
        alert(error?.message||"Could not read that Toast CSV.");
      }finally{
        toastUploadButton.disabled=false;
        toastUploadButton.textContent=oldText;
      }
    }

    async function handleToastPaste(event,group,parsed,financial,contracted,subtotalCheck,pasteZone,replaceButton,scanLog,results){
      const items=Array.from(event.clipboardData?.items||[]);
      const imageItem=items.find(item=>item.type&&item.type.startsWith("image/"));
      if(!imageItem)return;

      event.preventDefault();
      const blob=imageItem.getAsFile();
      if(!blob)return;

      pasteZone.classList.add("processing");
      pasteZone.style.display="none";
      replaceButton.classList.add("visible");
      results.replaceChildren();
      scanLog.replaceChildren();
      scanLog.classList.add("visible");

      try{
        await arType(scanLog,"Reading Toast sales summary…");

        const prepared=await prepareToastImage(blob);
        const text=await recognizeToastImage(prepared,scanLog);

        await arType(scanLog,"Matching Toast categories to contract…");

        const toast=parseToastSales(text);
        const comparison=compareAdditionalRevenue(toast,financial,parsed);
        group.toastData=toast;

        await arType(
          scanLog,
          comparison.items.length
            ? "Additional revenue found."
            : "No additional revenue found."
        );

        if(comparison.recognizedCount===0){
          throw new Error("No Toast rows passed currency validation");
        }

        parsed.arProcessed=true;
        parsed.arComparison=comparison;
        group.arComparison=comparison;

        renderAdditionalRevenue(results,comparison);
        updateSubtotalCheck(subtotalCheck,comparison);
        updateEventsProgress();
        updatePortfolioSales();

        if(contracted){
          contracted.open=false;
        }

        setTimeout(()=>{
          scanLog.classList.remove("visible");
        },450);
      }catch(error){
        console.error("Toast screenshot OCR failed:",error);
        scanLog.textContent="Toast screenshot reader hit an error. Please paste the same screenshot again.";
        pasteZone.style.display="";
        pasteZone.classList.remove("processing");
      }
    }

    async function prepareToastImage(blob){
      const bitmap=await createImageBitmap(blob);

      const targetWidth=Math.min(2600,Math.max(1400,bitmap.width*3));
      const scale=targetWidth/bitmap.width;
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(bitmap.width*scale);
      canvas.height=Math.round(bitmap.height*scale);

      const ctx=canvas.getContext("2d",{willReadFrequently:true});
      ctx.fillStyle="#ffffff";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality="high";
      ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
      bitmap.close();

      // Toast screenshots are clean UI captures. Converting to high-contrast
      // grayscale makes the table text much easier for OCR to read reliably.
      const image=ctx.getImageData(0,0,canvas.width,canvas.height);
      const data=image.data;

      for(let i=0;i<data.length;i+=4){
        const gray=Math.round(data[i]*0.299+data[i+1]*0.587+data[i+2]*0.114);
        const adjusted=gray>228?255:gray<95?0:Math.max(0,Math.min(255,(gray-95)*1.9));
        data[i]=adjusted;
        data[i+1]=adjusted;
        data[i+2]=adjusted;
        data[i+3]=255;
      }

      ctx.putImageData(image,0,0);
      return canvas;
    }

    async function ensureTesseract(){
      if(window.Tesseract)return window.Tesseract;

      const sources=[
        "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js",
        "https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js"
      ];

      let lastError=null;

      for(const src of sources){
        try{
          await new Promise((resolve,reject)=>{
            const existing=document.querySelector('script[data-tesseract-source="'+src+'"]');

            if(existing){
              if(window.Tesseract){
                resolve();
                return;
              }

              existing.addEventListener("load",resolve,{once:true});
              existing.addEventListener("error",reject,{once:true});
              return;
            }

            const script=document.createElement("script");
            script.src=src;
            script.async=true;
            script.dataset.tesseractSource=src;
            script.onload=resolve;
            script.onerror=()=>reject(new Error("Failed to load "+src));
            document.head.appendChild(script);
          });

          if(window.Tesseract)return window.Tesseract;
        }catch(error){
          lastError=error;
          console.warn("Tesseract source failed:",src,error);
        }
      }

      throw lastError||new Error("Tesseract did not load");
    }

    async function recognizeToastImage(canvas,scanLog){
      const Tesseract=await ensureTesseract();

      const logger=(message)=>{
        if(message.status==="recognizing text"&&Number.isFinite(message.progress)){
          const percent=Math.round(message.progress*100);
          scanLog.textContent="Reading Toast sales summary… "+percent+"%";
        }
      };

      let worker=null;

      try{
        worker=await Tesseract.createWorker("eng",1,{
          logger,
          workerPath:"https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/worker.min.js",
          corePath:"https://unpkg.com/tesseract.js-core@5.1.1",
          langPath:"https://tessdata.projectnaptha.com/4.0.0"
        });

        await worker.setParameters({
          preserve_interword_spaces:"1",
          tessedit_pageseg_mode:"6"
        });

        const result=await worker.recognize(canvas);
        return result?.data?.text||"";
      }catch(primaryError){
        console.warn("Primary OCR worker failed; trying fallback OCR.",primaryError);

        try{
          const fallback=await Tesseract.recognize(canvas,"eng",{
            logger,
            workerPath:"https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/worker.min.js",
            corePath:"https://unpkg.com/tesseract.js-core@5.1.1",
            langPath:"https://tessdata.projectnaptha.com/4.0.0"
          });

          return fallback?.data?.text||"";
        }catch(fallbackError){
          console.error("Fallback OCR also failed.",fallbackError);
          throw fallbackError;
        }
      }finally{
        if(worker){
          try{await worker.terminate()}catch(_){}
        }
      }
    }

    function extractToastLBW(source,flat){
      const alcohol={Beer:null,Liquor:null,Wine:null};
      const rows=String(source||"").split(/\r?\n/).map(clean).filter(Boolean);

      for(const label of Object.keys(alcohol)){
        // First choice: find the actual OCR row, allowing harmless leading OCR noise.
        for(let i=0;i<rows.length;i++){
          if(!new RegExp("\\b"+label+"\\b","i").test(rows[i]))continue;

          const candidates=[
            rows[i],
            clean(rows[i]+" "+(rows[i+1]||"")),
            clean((rows[i-1]||"")+" "+rows[i]+" "+(rows[i+1]||""))
          ];

          for(const candidate of candidates){
            const amounts=extractToastAmounts(candidate);
            if(amounts.length){
              alcohol[label]=amounts[0];
              break;
            }
          }

          if(alcohol[label]!==null)break;
        }

        if(alcohol[label]!==null)continue;

        // Fallback for OCR that flattened the visual row structure.
        // Start exactly at this category label and inspect only a short window
        // after it, so Beer/Liquor/Wine cannot steal values from one another.
        const re=new RegExp("\\b"+label+"\\b","i");
        const match=re.exec(flat);

        if(match){
          const segment=flat.slice(match.index,Math.min(flat.length,match.index+180));
          const amounts=extractToastAmounts(segment);

          if(amounts.length){
            alcohol[label]=amounts[0];
          }
        }
      }

      const found=Object.values(alcohol).filter(value=>value!==null);

      return{
        values:alcohol,
        count:found.length,
        total:found.reduce((sum,value)=>sum+value,0)
      };
    }

    function hasAllAlcoholLabels(text){
      const x=String(text||"").toLowerCase();

      const hasBeer=/\bbe[e3]r\b/i.test(x);
      const hasLiquor=/\bl[i1]qu[o0]r\b/i.test(x);
      const hasWine=/\bw[i1l]ne\b/i.test(x);

      return hasBeer&&hasLiquor&&hasWine;
    }

    function parseToastSales(text){
      const totals={
        Food:0,
        Beverages:0,
        LBW:0,
        NA:0,
        Gameplay:0,
        Retail:0,
        Labor:0,
        "Equipment Rental":0,
        "Space Rental":0,
        "Digital Media":0,
        Fees:0,
        "Other Fees":0,
        "Voluntary Tip":0,
        "Service Charge":0,
        "Admin Fee":0
      };
      const recognized=new Set();

      const source=String(text||"");
      const flat=source
        .replace(/[|]/g," ")
        .replace(/\s+/g," ")
        .trim();

      const categories=[
        {label:"Food",patterns:[/\bFood\b/i]},
        {label:"Beverages",patterns:[/\bEvent\s+Drink\s+Package\b/i,/\bDrink\s+Package\b/i,/\bBeverage\s+Package\b/i]},
        {label:"Gameplay",patterns:[/\bGame\s*Play\b/i,/\bGameplay\b/i]},
        {label:"Equipment Rental",patterns:[/\bEvent\s*[-–—]?\s*Equipment\s+Rental\b/i,/\bEquipment\s+Rental\b/i]},
        {label:"Space Rental",patterns:[/\bEvent\s*[-–—]?\s*Space\s+Rental\b/i,/\bSpace\s+Rental\b/i]},
        {label:"Digital Media",patterns:[/\bMarketing\s+Partnerships?\b/i,/\bDigital\s+Media\b/i]},
        {label:"Admin Fee",patterns:[/\bAdmin\s+Fee\b/i]},
        {label:"Service Charge",patterns:[/\bService\s+Charge\b/i]},
        {label:"Voluntary Tip",patterns:[/\bVoluntary\s*Tip\b/i,/\bVoluntary\s+Gratuity\b/i,/\bGratuity\b/i]},
        {label:"Fees",patterns:[/\bEvents?\s*[-–—]?\s*Fees?\b/i,/(?<!Admin )\bFees?\b/i]},
        {label:"NA",patterns:[/\bN\s*\/?\s*A\s*Bev\b/i,/\bNA\s*Bev\b/i,/\bNon[- ]?Alcoholic\b/i]},
        {label:"Retail",patterns:[/\bRetail\b/i]},
        {label:"Labor",patterns:[/\bEvent\s*[-–—]?\s*Labou?r\b/i,/\bLabou?r\b/i]},
        {label:"Beer",patterns:[/\bBeer\b/i]},
        {label:"Liquor",patterns:[/\bLiquor\b/i]},
        {label:"Wine",patterns:[/\bWine\b/i]},
        {label:"Coach",patterns:[/\bCoach\b/i]}
      ];

      const hits=[];

      for(const category of categories){
        let best=null;

        for(const pattern of category.patterns){
          const match=pattern.exec(flat);
          if(match&&(!best||match.index<best.index)){
            best={index:match.index,length:match[0].length};
          }
        }

        if(best)hits.push({...category,...best});
      }

      hits.sort((a,b)=>a.index-b.index);

      for(let i=0;i<hits.length;i++){
        const hit=hits[i];
        const next=hits[i+1];
        const end=next?next.index:Math.min(flat.length,hit.index+240);
        const segment=flat.slice(hit.index+hit.length,end);

        const amounts=extractToastAmounts(segment);
        if(!amounts.length)continue;

        const netSales=amounts[0];
        if(netSales===null)continue;

        if(hit.label==="Beer"||hit.label==="Liquor"||hit.label==="Wine"){
          totals.LBW+=netSales;
          recognized.add("LBW");
        }else if(hit.label==="Coach"){
          totals.Coach+=netSales;
          recognized.add("Coach");
        }else{
          totals[hit.label]+=netSales;
          recognized.add(hit.label);
        }
      }

      // Fallback for OCR engines that preserve each table row cleanly.
      const rows=source.split(/\r?\n/).map(clean).filter(Boolean);
      let totalNetSales=null;

      for(const row of rows){
        if(/^tota(?:l|1|!)(?:\s|$)/i.test(row)){
          const totalAmounts=extractToastAmounts(row);
          if(totalAmounts.length){
            totalNetSales=totalAmounts[0];
          }
          continue;
        }
        const category=mapToastCategory(row);
        if(!category)continue;

        const amounts=extractToastAmounts(row);
        if(!amounts.length)continue;

        if(category==="LBW"){
          // Beer/Liquor/Wine are handled together by extractToastLBW below.
          continue;
        }

        // Only fill other categories not already recovered from the flattened table.
        if(Math.abs(totals[category]||0)<0.005){
          totals[category]+=amounts[0];
        }
        recognized.add(category);
      }

      const lbw=extractToastLBW(source,flat);

      if(lbw.count>0){
        totals.LBW=lbw.total;
        recognized.add("LBW");
      }

      if(totalNetSales===null){
        const totalMatch=flat.match(/\btota(?:l|1|!)\s+\d+\s+(.{0,120})$/i);
        if(totalMatch){
          const totalAmounts=extractToastAmounts(totalMatch[1]);
          if(totalAmounts.length){
            totalNetSales=totalAmounts[0];
          }
        }
      }

      // When Beer, Liquor, and Wine are all present, L/B/W must reconcile
      // against the authoritative Toast Total Net Sales. This prevents one
      // slightly misread alcohol row from producing a partial/wrong LBW total.
      if(totalNetSales!==null&&hasAllAlcoholLabels(source)){
        const nonAlcoholLabels=[
          "Food","Beverages","NA","Gameplay","Retail","Labor",
          "Equipment Rental","Space Rental","Digital Media","Coach",
          "Fees","Other Fees","Voluntary Tip","Service Charge","Admin Fee"
        ];

        const nonAlcoholTotal=nonAlcoholLabels.reduce(
          (sum,label)=>sum+Number(totals[label]||0),
          0
        );

        const reconciledLBW=totalNetSales-nonAlcoholTotal;

        if(Number.isFinite(reconciledLBW)&&reconciledLBW>=-0.005){
          totals.LBW=Math.max(0,reconciledLBW);
          recognized.add("LBW");
        }
      }

      if(totalNetSales===null&&recognized.size){
        const reconstructLabels=[
          "Food","Beverages","LBW","NA","Gameplay","Retail","Labor",
          "Equipment Rental","Space Rental","Digital Media","Coach",
          "Fees","Other Fees","Voluntary Tip","Service Charge","Admin Fee"
        ];

        totalNetSales=reconstructLabels.reduce(
          (sum,label)=>sum+Number(totals[label]||0),
          0
        );
      }

      totals.__recognized=recognized;
      totals.__totalNetSales=totalNetSales;
      return totals;
    }

    function mapToastCategory(row){
      const x=row.toLowerCase().replace(/\s+/g," ").trim();

      if(/\bbeer\b/.test(x)||/\bliquor\b/.test(x)||/\bwine\b/.test(x))return"LBW";
      if(/^n\/?a\s*bev\b|^na\s*bev\b|^non[- ]?alcoholic\b/.test(x))return"NA";
      if(/^food\b/.test(x))return"Food";
      if(/^event\s+drink\s+package\b|^drink\s+package\b|^beverage\s+package\b/.test(x))return"Beverages";
      if(/^game\s*play\b|^gameplay\b/.test(x))return"Gameplay";
      if(/^retail\b/.test(x))return"Retail";
      if(/^event\s*-\s*labou?r\b|^labou?r\b/.test(x))return"Labor";
      if(/^event\s*-\s*equipment\s+rental\b|^equipment\s+rental\b/.test(x))return"Equipment Rental";
      if(/^event\s*-\s*space\s+rental\b|^event\s+space\s+rental\b|^space\s+rental\b/.test(x))return"Space Rental";
      if(/^marketing\s+partnerships?\b|^digital\s+media\b/.test(x))return"Digital Media";
      if(/^admin\s*fee\b/.test(x))return"Admin Fee";
      if(/^service\s+charge\b/.test(x))return"Service Charge";
      if(/^voluntary\s*tip\b|^voluntary\s+gratuity\b|^gratuity\b/.test(x))return"Voluntary Tip";
      if(/^events?\s*-\s*fees?\b|^events?\s+fees?\b|^fees?\b/.test(x))return"Fees";
      if(/^coach\b/.test(x))return"Other Fees";

      return null;
    }

    function extractToastAmounts(row){
      // Every Toast money cell visibly begins with "$". OCR commonly confuses
      // that symbol with "S" or "5" (for example "$68.27" -> "568.27").
      // Treat the FIRST character as the currency marker and never as part of
      // the numeric value.
      const rawTokens=[
        ...String(row||"").matchAll(/(?:^|\s)([$S5])\s*(-?\d[\d,]*\.\d{2})(?=\s|$)/gi)
      ].map(match=>({
        marker:match[1],
        value:parseMoney(match[2])
      })).filter(token=>token.value!==null);

      if(rawTokens.length<3)return[];

      // A Toast category row has Net Sales, Discounts, Gross Sales.
      // Require those three columns to reconcile before accepting the row.
      for(let i=0;i<=rawTokens.length-3;i++){
        const net=rawTokens[i].value;
        const discounts=rawTokens[i+1].value;
        const gross=rawTokens[i+2].value;

        if(
          Number.isFinite(net)&&
          Number.isFinite(discounts)&&
          Number.isFinite(gross)&&
          Math.abs((net+discounts)-gross)<=0.03
        ){
          return[net,discounts,gross];
        }
      }

      // Fail closed: if the Toast row does not mathematically reconcile,
      // do not use any dollar value from it for AR.
      return[];
    }

    function compareAdditionalRevenue(toast,financial,parsed){
      // Compare Toast to the same contracted numbers the user sees in the
      // Contracted boxes. Beverage packages stay separate from day-of L/B/W.
      const contracted={
        Food:Number(financial.categories.Food||0),
        Beverages:Number(financial.categories.Beverages||0),
        LBW:Number(financial.categories.LBW||0),
        NA:Number(financial.categories.NA||0),
        Gameplay:Number(financial.categories.Gameplay||0),
        Retail:Number(financial.categories.Retail||0),
        Labor:Number(financial.categories.Labor||0),
        "Equipment Rental":Number(financial.categories["Equipment Rental"]||0),
        "Space Rental":Number(financial.categories["Space Rental"]||0),
        "Digital Media":Number(financial.categories["Digital Media"]||0),
        Coach:Number(financial.categories.Coach||0),
        "Other Fees":Number(financial.categories["Other Fees"]||0),
        "Voluntary Tip":0,
        "Admin Fee":Number(financial.adminFee||0)
      };

      const items=[];
      const recognized=toast.__recognized instanceof Set?toast.__recognized:new Set();

      // AR treats all beverage-package revenue and day-of Beer/Liquor/Wine
      // as one L/B/W bucket. "Beverages" remains separate only in Contracted.
      if(recognized.has("Beverages")||recognized.has("LBW")){
        const actual=
          Number(toast.Beverages||0)+
          Number(toast.LBW||0);
        const base=
          Number(contracted.Beverages||0)+
          Number(contracted.LBW||0);
        const additional=actual-base;

        if(Math.abs(additional)>0.004){
          items.push({
            label:"LBW",
            actual,
            contracted:base,
            additional
          });
        }
      }

      const expectedLabels=[
        "Food","NA","Gameplay","Retail","Labor",
        "Equipment Rental","Space Rental","Digital Media","Coach",
        "Other Fees","Voluntary Tip","Admin Fee"
      ];

      for(const label of expectedLabels){
        if(!recognized.has(label))continue;

        const actual=Number(toast[label]||0);
        const base=Number(contracted[label]||0);
        const additional=actual-base;

        if(Math.abs(additional)>0.004){
          items.push({label,actual,contracted:base,additional});
        }
      }

      const isFlex=Array.isArray(parsed&&parsed.tags)&&parsed.tags.includes("Flex");

      if(recognized.has("Fees")){
        const feeAmount=Number(toast.Fees||0);

        if(Math.abs(feeAmount)>0.004){
          items.push({
            label:isFlex?"Unused F&B":"Other",
            actual:feeAmount,
            contracted:0,
            additional:feeAmount
          });
        }
      }

      items.sort((a,b)=>b.additional-a.additional);

      const grossTotal=items.reduce((sum,item)=>sum+item.additional,0);
      const fbMinimum=isFlex?Number(financial.categories["F&B Minimum"]||0):0;
      const total=isFlex?grossTotal-fbMinimum:grossTotal;

      const toastTotalNetSales=
        toast.__totalNetSales!==null &&
        toast.__totalNetSales!==undefined &&
        Number.isFinite(Number(toast.__totalNetSales))
          ? Number(toast.__totalNetSales)
          : null;

      const toastAdminFee=Number(toast["Admin Fee"]||0);
      const toastServiceCharge=Number(toast["Service Charge"]||0);

      // Base the check on the category totals actually shown in Contracted,
      // rather than a separately parsed hidden amount.
      const contractedCategorySubtotal=[
        "Food","Beverages","NA","F&B Minimum","Gameplay","Retail","Labor",
        "Equipment Rental","Space Rental","Digital Media","Coach","Other Fees"
      ].reduce(
        (sum,label)=>sum+Number(financial.categories[label]||0),
        0
      );

      const contractedSubtotal=
        Number.isFinite(contractedCategorySubtotal)
          ? contractedCategorySubtotal
          : (
              financial.subtotal!==null &&
              financial.subtotal!==undefined &&
              Number.isFinite(Number(financial.subtotal))
                ? Number(financial.subtotal)
                : null
            );

      let subtotalCheck=null;

      if(
        toastTotalNetSales!==null &&
        contractedSubtotal!==null
      ){
        // Signed AR is intentional: Toast can be below the contract.
        const expectedAR=
          toastTotalNetSales-toastAdminFee-toastServiceCharge-contractedSubtotal;
        const arDifference=total-expectedAR;

        subtotalCheck={
          pass:Math.abs(arDifference)<=0.03,
          toastTotalNetSales,
          toastAdminFee,
          toastServiceCharge,
          totalAR:total,
          expectedAR,
          contractedSubtotal,
          arDifference,
          discrepancy:Math.abs(arDifference)
        };
      }

      return{
        items,
        grossTotal,
        fbMinimum,
        flexAdjusted:isFlex&&fbMinimum>0.004,
        total,
        subtotalCheck,
        toastServiceCharge,
        recognizedCount:recognized.size
      };
    }

    function renderAdditionalRevenue(container,comparison){
      container.replaceChildren();

      if(!comparison.items.length){
        const empty=document.createElement("div");
        empty.className="ar-empty";
        empty.textContent="No additional revenue detected.";
        container.appendChild(empty);
      }else{
        for(const item of comparison.items){
          const row=document.createElement("div");
          row.className="ar-item "+arClassName(item.label)+(item.additional<0?" negative":"");

          const left=document.createElement("div");

          const label=document.createElement("div");
          label.className="ar-item-label";
          label.textContent=item.label==="LBW"?"L/B/W":item.label;

          const detail=document.createElement("div");
          detail.className="ar-item-detail";
          detail.textContent=
            item.label==="Play It Forward"
              ? "Contracted "+formatMoney(item.contracted)
              : "Toast "+formatMoney(item.actual)+" · Contracted "+formatMoney(item.contracted);

          const value=document.createElement("div");
          value.className="ar-item-value";
          value.textContent=formatSignedMoney(item.additional);

          left.append(label,detail);
          row.append(left,value);
          container.appendChild(row);
        }
      }

      if(comparison.flexAdjusted){
        const calculation=document.createElement("div");
        calculation.className="ar-calculation";

        const grossRow=document.createElement("div");
        grossRow.className="ar-calc-row";

        const grossLabel=document.createElement("span");
        grossLabel.textContent="Additional Revenue Subtotal";

        const grossValue=document.createElement("strong");
        grossValue.textContent=formatMoney(comparison.grossTotal);

        grossRow.append(grossLabel,grossValue);

        const deductionRow=document.createElement("div");
        deductionRow.className="ar-calc-row deduction";

        const deductionLabel=document.createElement("span");
        deductionLabel.textContent="F&B Minimum";

        const deductionValue=document.createElement("strong");
        deductionValue.textContent="−"+formatMoney(comparison.fbMinimum);

        deductionRow.append(deductionLabel,deductionValue);
        calculation.append(grossRow,deductionRow);
        container.appendChild(calculation);
      }

      const total=document.createElement("div");
      total.className="ar-total"+(comparison.total<0?" negative":"");

      const totalLabel=document.createElement("span");
      totalLabel.textContent="Total Additional Revenue";

      const totalValue=document.createElement("strong");
      totalValue.textContent=formatMoney(comparison.total);

      total.append(totalLabel,totalValue);
      container.appendChild(total);
    }

    function updateEventsProgress(){
      const total=currentGroups.length;
      const passed=currentGroups.filter(group=>
        group?.parsed?.arProcessed &&
        group?.parsed?.arComparison?.subtotalCheck?.pass
      ).length;

      eventsProgressText.textContent=passed+"/"+total;
      eventsProgressBar.style.width=total?((passed/total)*100)+"%":"0%";
      eventsProgressBar.title=passed+" of "+total+" events passed subtotal check";
    }

    function getPortfolioSalesTotal(){
      return currentGroups.reduce((sum,group)=>{
        const parsed=group?.parsed;
        if(!parsed)return sum;

        const subtotal=Number(parsed.financial?.subtotal||0);
        const ar=
          parsed.arProcessed&&parsed.arComparison
            ? Number(parsed.arComparison.total||0)
            : 0;

        return sum+subtotal+ar;
      },0);
    }

    function getPrimaryEventDateRaw(){
      const dates=currentGroups
        .map(group=>group?.parsed?.date)
        .filter(Boolean);

      if(!dates.length)return null;

      const counts=new Map();
      for(const date of dates){
        counts.set(date,(counts.get(date)||0)+1);
      }

      return [...counts.entries()]
        .sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
    }

    function parseEventDate(raw){
      const match=String(raw||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if(!match)return null;

      return new Date(
        Number(match[3]),
        Number(match[1])-1,
        Number(match[2]),
        12,0,0
      );
    }

    function getPortfolioSalesDate(){
      const raw=getPrimaryEventDateRaw();
      if(!raw)return"—";

      const date=parseEventDate(raw);
      if(!date)return raw;

      return new Intl.DateTimeFormat("en-US",{
        weekday:"short",
        month:"short",
        day:"numeric",
        year:"numeric"
      }).format(date);
    }

    function getExportPdfName(){
      const raw=getPrimaryEventDateRaw();
      const date=parseEventDate(raw);

      if(!date)return"AR.pdf";

      const weekday=new Intl.DateTimeFormat("en-US",{weekday:"short"}).format(date);
      const mm=String(date.getMonth()+1).padStart(2,"0");
      const dd=String(date.getDate()).padStart(2,"0");
      const yy=String(date.getFullYear()).slice(-2);

      return weekday+" "+mm+"."+dd+"."+yy+" AR.pdf";
    }

    function animatePortfolioSales(target){
      const end=Number.isFinite(target)?target:0;

      if(portfolioSalesAnimation){
        cancelAnimationFrame(portfolioSalesAnimation);
        portfolioSalesAnimation=null;
      }

      if(reduced){
        portfolioSalesDisplay=end;
        portfolioSalesValue.textContent=formatMoney(end);
        return;
      }

      const startValue=portfolioSalesDisplay;
      const delta=end-startValue;

      if(Math.abs(delta)<0.005){
        portfolioSalesDisplay=end;
        portfolioSalesValue.textContent=formatMoney(end);
        return;
      }

      const started=performance.now();
      const duration=Math.min(
        1350,
        Math.max(650,700+Math.log10(Math.abs(delta)+1)*130)
      );

      const tick=(now)=>{
        const progress=Math.min(1,(now-started)/duration);
        const eased=1-Math.pow(1-progress,4);
        portfolioSalesDisplay=startValue+(delta*eased);
        portfolioSalesValue.textContent=formatMoney(portfolioSalesDisplay);

        if(progress<1){
          portfolioSalesAnimation=requestAnimationFrame(tick);
        }else{
          portfolioSalesDisplay=end;
          portfolioSalesValue.textContent=formatMoney(end);
          portfolioSalesAnimation=null;
        }
      };

      portfolioSalesAnimation=requestAnimationFrame(tick);
    }

    function updatePortfolioSales(){
      portfolioSalesDate.textContent=getPortfolioSalesDate();
      animatePortfolioSales(getPortfolioSalesTotal());
    }

        "Unused F&B":"UNUSED F&B",

    async function getPdfPageTextItems(pdf,pageNumber){
      if(!pdf)return[];
      const page=await pdf.getPage(pageNumber);
      const content=await page.getTextContent();

      return content.items
        .filter(item=>item.str&&item.str.trim())
        .map(item=>({
          text:clean(item.str),
          x:(item.transform&&item.transform[4])||0,
          y:(item.transform&&item.transform[5])||0,
          width:item.width||0
        }));
    }

    async function getPageTextItems(pageNumber){
      return getPdfPageTextItems(currentSourcePdfJs,pageNumber);
    }

    function wrapPdfText(font,text,size,maxWidth,maxLines=2){
      const words=String(text||"").split(/\s+/).filter(Boolean);
      const lines=[];
      let current="";

      for(const word of words){
        const next=current?current+" "+word:word;

        if(font.widthOfTextAtSize(next,size)<=maxWidth){
          current=next;
          continue;
        }

        if(current)lines.push(current);
        current=word;

        if(lines.length>=maxLines-1)break;
      }

      if(current&&lines.length<maxLines)lines.push(current);
      return lines;
    }

    function drawExportCheck(page,x,y,pass){
      const green=rgb(0.20,0.62,0.34);
      const yellow=rgb(0.86,0.64,0.12);
      const paleGreen=rgb(0.88,0.97,0.90);
      const paleYellow=rgb(1.00,0.96,0.78);
      const color=pass?green:yellow;

      page.drawCircle({
        x,
        y,
        size:7,
        color:pass?paleGreen:paleYellow,
        borderColor:color,
        borderWidth:1
      });

      if(pass){
        page.drawLine({
          start:{x:x-3.1,y:y},
          end:{x:x-0.7,y:y-2.8},
          thickness:1.5,
          color
        });
        page.drawLine({
          start:{x:x-0.7,y:y-2.8},
          end:{x:x+3.8,y:y+3.1},
          thickness:1.5,
          color
        });
      }else{
        page.drawLine({
          start:{x,y:y+3.2},
          end:{x,y:y-1.5},
          thickness:1.5,
          color
        });
        page.drawCircle({
          x,
          y:y-4,
          size:0.9,
          color
        });
      }
    }

    async function drawEventARExport(pdfDoc,group,font,bold,outputStartIndex){
      if(!group.pdf?.numPages)return;

      const parsed=group.parsed||{};
      const comparison=parsed.arComparison||null;
      const firstPage=pdfDoc.getPage(outputStartIndex);
      const firstItems=await getPdfPageTextItems(group.pdf,1);

      const booking=
        firstItems.find(item=>/^BOOKING TYPE\s*:/i.test(item.text)) ||
        firstItems.find(item=>/BOOKING TYPE/i.test(item.text));

      const pageWidth=firstPage.getWidth();

      // Use the actual BEO content/table width, not the whole PDF page.
      // The first section heading below Booking Type shares the same left edge
      // as the content box, so it gives us a reliable horizontal boundary.
      const sectionBelow=firstItems
        .filter(item=>
          booking &&
          item.y<booking.y-4 &&
          /^(?:Asset|Beverages?|Food|Gameplay|Game Enhancement|Retail|Labor|Limited Inventory|Equipment Rental|Event Space Rental|Space Rental|Digital Media|Incentives?)$/i.test(item.text)
        )
        .sort((a,b)=>b.y-a.y)[0]||null;

      const detectedLeft=Math.min(
        booking?.x??48,
        sectionBelow?.x??(booking?.x??48)
      );
      const contentLeft=Math.max(36,detectedLeft-4);
      const contentRight=pageWidth-contentLeft;
      const contentWidth=contentRight-contentLeft;
      const centerX=(contentLeft+contentRight)/2;
      const y=booking?booking.y-22:firstPage.getHeight()-220;

      if(!parsed.arProcessed||!comparison){
        const notDone="AR NOT COMPLETED";
        const size=10.4;
        const width=bold.widthOfTextAtSize(notDone,size);

        firstPage.drawText(notDone,{
          x:centerX-(width/2),
          y,
          size,
          font:bold,
          color:rgb(0.45,0.45,0.48)
        });
      }else{
        const pieces=comparison.items.map(item=>
          exportCategoryLabel(item.label)+" "+formatSignedMoney(item.additional)
        );

        let totalY=y;

        // Only show the category line when there are actual AR categories.
        if(pieces.length){
          const categorySize=10.2;
          const separator="     |     ";
          const separatorWidth=bold.widthOfTextAtSize(separator,categorySize);
          const pieceWidths=pieces.map(piece=>bold.widthOfTextAtSize(piece,categorySize));
          const oneLineWidth=
            pieceWidths.reduce((sum,width)=>sum+width,0)+
            separatorWidth*Math.max(0,pieces.length-1);

          if(oneLineWidth<=contentWidth){
            let drawX=centerX-(oneLineWidth/2);

            pieces.forEach((piece,index)=>{
              firstPage.drawText(piece,{
                x:drawX,
                y,
                size:categorySize,
                font:bold,
                color:rgb(0.10,0.10,0.12)
              });

              drawX+=pieceWidths[index];

              if(index<pieces.length-1){
                firstPage.drawText(separator,{
                  x:drawX,
                  y,
                  size:categorySize,
                  font:bold,
                  color:rgb(0.34,0.34,0.37)
                });
                drawX+=separatorWidth;
              }
            });

            totalY=y-16;
          }else{
            const categoryText=pieces.join("  |  ");
            const lines=wrapPdfText(bold,categoryText,categorySize,contentWidth,2);

            lines.forEach((line,index)=>{
              const lineWidth=bold.widthOfTextAtSize(line,categorySize);

              firstPage.drawText(line,{
                x:centerX-(lineWidth/2),
                y:y-(index*13),
                size:categorySize,
                font:bold,
                color:rgb(0.10,0.10,0.12)
              });
            });

            totalY=y-(lines.length*13)-3;
          }
        }

        const totalLabel="TOTAL AR: ";
        const green=rgb(0.10,0.44,0.22);
        const red=rgb(0.70,0.16,0.16);
        const totalAccent=comparison.total<0?red:green;
        const black=rgb(0.10,0.10,0.12);
        const totalSize=11.4;
        const totalLabelGap=4;

        if(comparison.flexAdjusted){
          const formulaText=
            formatMoney(comparison.grossTotal)+
            " - "+
            formatMoney(comparison.fbMinimum)+
            " =  ";
          const resultText=formatMoney(comparison.total);

          const labelWidth=bold.widthOfTextAtSize(totalLabel,totalSize);
          const formulaWidth=bold.widthOfTextAtSize(formulaText,totalSize);
          const resultWidth=bold.widthOfTextAtSize(resultText,totalSize);
          const totalWidth=labelWidth+totalLabelGap+formulaWidth+resultWidth;
          const startX=centerX-(totalWidth/2);

          // Keep the TOTAL AR label and final answer green, while the actual
          // subtraction stays black for quick visual separation.
          firstPage.drawText(totalLabel,{
            x:startX,
            y:totalY,
            size:totalSize,
            font:bold,
            color:totalAccent
          });

          firstPage.drawText(formulaText,{
            x:startX+labelWidth+totalLabelGap,
            y:totalY,
            size:totalSize,
            font:bold,
            color:black
          });

          firstPage.drawText(resultText,{
            x:startX+labelWidth+totalLabelGap+formulaWidth,
            y:totalY,
            size:totalSize,
            font:bold,
            color:totalAccent
          });
        }else{
          const resultText=formatMoney(comparison.total);
          const labelWidth=bold.widthOfTextAtSize(totalLabel,totalSize);
          const resultWidth=bold.widthOfTextAtSize(resultText,totalSize);
          const totalWidth=labelWidth+totalLabelGap+resultWidth;
          const startX=centerX-(totalWidth/2);

          firstPage.drawText(totalLabel,{
            x:startX,
            y:totalY,
            size:totalSize,
            font:bold,
            color:totalAccent
          });

          firstPage.drawText(resultText,{
            x:startX+labelWidth+totalLabelGap,
            y:totalY,
            size:totalSize,
            font:bold,
            color:totalAccent
          });
        }
      }

      if(!parsed.arProcessed||!comparison)return;

      let billingLocalIndex=null;
      let billingItems=[];

      for(let pageNumber=1;pageNumber<=group.pdf.numPages;pageNumber++){
        const items=await getPdfPageTextItems(group.pdf,pageNumber);
        const pageText=items.map(item=>item.text).join(" ");

        if(
          /\bBILLING SUMMARY\b/i.test(pageText) ||
          /Subtotal\s+Taxes\s+Service Charge\s+Admin Fee\s+Total Charges/i.test(pageText)
        ){
          billingLocalIndex=pageNumber-1;
          billingItems=items;
          break;
        }
      }

      if(billingLocalIndex===null)return;

      const billingPage=pdfDoc.getPage(outputStartIndex+billingLocalIndex);

      const subtotal=billingItems.find(item=>/^Subtotal$/i.test(item.text));
      if(!subtotal)return;

      const paymentSummary=billingItems.find(item=>/^PAYMENT SUMMARY$/i.test(item.text));
      const check=comparison.subtotalCheck;
      const pass=Boolean(check&&check.pass);

      // Keep the indicator inside the left Subtotal cell. The Subtotal label is
      // centered in that cell, so shifting left places the badge safely inside it.
      const badgeX=Math.max(12,subtotal.x-34);
      const badgeY=subtotal.y-14;

      drawExportCheck(billingPage,badgeX,badgeY,pass);

      if(check&&!check.pass){
        const direction=check.arDifference>0?"AR up ":"AR down ";
        const discrepancyText=direction+formatMoney(check.discrepancy);
        const discrepancyY=paymentSummary
          ? paymentSummary.y+5
          : subtotal.y-38;

        billingPage.drawText(discrepancyText,{
          x:subtotal.x,
          y:discrepancyY,
          size:6.2,
          font:bold,
          color:rgb(0.62,0.43,0.08)
        });
      }
    }

    async function exportAnnotatedPdf(){
      if(!currentGroups.length)return;

      const oldText=exportButton.textContent;
      exportButton.disabled=true;
      exportButton.textContent="Exporting…";

      try{
        const pdfDoc=await PDFDocument.create();
        const font=await pdfDoc.embedFont(StandardFonts.Helvetica);
        const bold=await pdfDoc.embedFont(StandardFonts.HelveticaBold);

        for(const group of currentGroups){
          if(!group.pdfBytes)continue;

          const eventDoc=await PDFDocument.load(group.pdfBytes.slice());
          const indices=eventDoc.getPageIndices();
          const outputStartIndex=pdfDoc.getPageCount();
          const copied=await pdfDoc.copyPages(eventDoc,indices);

          copied.forEach(page=>pdfDoc.addPage(page));

          await drawEventARExport(
            pdfDoc,
            group,
            font,
            bold,
            outputStartIndex
          );
        }

        const bytes=await pdfDoc.save();
        const blob=new Blob([bytes],{type:"application/pdf"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;
        a.download=getExportPdfName();
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(()=>URL.revokeObjectURL(url),1500);
      }catch(error){
        console.error("AR export failed:",error);
        alert("Could not export the annotated PDF. Please try again.");
      }finally{
        exportButton.disabled=false;
        exportButton.textContent=oldText;
      }
    }

    function showNoToastData(group){
      const parsed=group?.parsed;
      const ui=group?.ui;
      if(!parsed||!ui)return;

      parsed.arProcessed=false;
      parsed.arComparison=null;
      group.arComparison=null;

      ui.subtotalCheck.className="subtotal-check missing visible";
      ui.subtotalCheck.textContent="?";
      ui.subtotalCheck.dataset.tooltip="No Toast data found for this event";
      ui.subtotalCheck.setAttribute(
        "aria-label",
        "No Toast data found for this event"
      );

      ui.arResults.replaceChildren();
      const message=document.createElement("div");
      message.className="ar-no-toast";
      message.textContent="No Toast data found for this event";
      ui.arResults.appendChild(message);

      ui.scanLog.replaceChildren();
      ui.scanLog.classList.remove("visible");
      ui.pasteZone.classList.remove("processing");
      ui.pasteZone.style.display="";
      ui.replaceButton.classList.remove("visible");
    }

    function updateSubtotalCheck(badge,comparison){
      if(!badge)return;

      const check=comparison.subtotalCheck;

      badge.className="subtotal-check";
      badge.textContent="";
      badge.removeAttribute("data-tooltip");

      if(!check){
        badge.classList.add("warn","visible");
        badge.textContent="!";
        badge.dataset.tooltip="Subtotal check discrepancy\n(unable to fully reconcile)";
        badge.setAttribute(
          "aria-label",
          "Subtotal check discrepancy. Unable to fully reconcile."
        );
        return;
      }

      if(check.pass){
        badge.classList.add("pass","visible");
        badge.textContent="✓";
        badge.dataset.tooltip="Subtotal check pass";
        badge.setAttribute("aria-label","Subtotal check pass");
      }else{
        badge.classList.add("warn","visible");
        badge.textContent="!";

        const discrepancy=check.discrepancy;
        const arDirection=check.arDifference>0?"up":"down";
        const detail="AR "+arDirection+" "+formatMoney(discrepancy);

        badge.dataset.tooltip="Subtotal check discrepancy\n("+detail+")";
        badge.setAttribute(
          "aria-label",
          "Subtotal check discrepancy. "+detail+"."
        );
      }
    }

    function arClassName(label){
      const classes={
        Food:"food",
        Beverages:"beverages",
        LBW:"lbw",
        NA:"na",
        Gameplay:"gameplay",
        Retail:"retail",
        Labor:"labor",
        "Equipment Rental":"equipment-rental",
        "Space Rental":"space-rental",
        "Digital Media":"digital-media",
        Coach:"other",
        "Play It Forward":"other",
        "Unused F&B":"unused-fb",
        Other:"other",
        "Other Fees":"other-fees",
        "Admin Fee":"admin-fee"
      };

      return classes[label]||"other-fees";
    }

    async function arType(target,message){
      target.classList.add("visible");
      target.textContent="";

      if(reduced){
        target.textContent=message;
        return;
      }

      for(let i=0;i<message.length;i++){
        target.textContent+=message[i];
        await delay(2);
      }
    }

    function makeFinanceItem(label,value,total,detail,originalValue=null,incentiveAmount=0){
      const item=document.createElement("div");
      item.className="finance-item";

      const l=document.createElement("div");
      l.className="finance-label";
      l.textContent=label;

      if(originalValue){
        const valueLine=document.createElement("div");
        valueLine.className="finance-value-line";

        const original=document.createElement("span");
        original.className="finance-original";
        original.textContent=originalValue;

        const discounted=document.createElement("span");
        discounted.className="finance-discounted";
        discounted.textContent=value;

        valueLine.append(original,discounted);
        item.append(l,valueLine);

        const note=document.createElement("div");
        note.className="finance-incentive-note";
        note.textContent="Incentive −"+formatMoney(Math.abs(Number(incentiveAmount||0)));
        item.appendChild(note);
      }else{
        const v=document.createElement("div");
        v.className="finance-value";
        v.textContent=value;
        item.append(l,v);
      }

      if(detail){
        const d=document.createElement("div");
        d.className="other-detail";
        d.textContent=detail;
        item.appendChild(d);
      }

      return item;
    }

    async function renderThumbnail(pdf,canvas){
      const page=await pdf.getPage(1);
      const base=page.getViewport({scale:1});
      const scale=Math.min(300/base.width,175/base.height);
      const viewport=page.getViewport({scale});
      const output=Math.min(devicePixelRatio||1,2);
      const ctx=canvas.getContext("2d");
      canvas.width=Math.floor(viewport.width*output);
      canvas.height=Math.floor(viewport.height*output);
      canvas.style.width=Math.floor(viewport.width)+"px";
      canvas.style.height=Math.floor(viewport.height)+"px";
      await page.render({canvasContext:ctx,viewport,transform:output!==1?[output,0,0,output,0,0]:null}).promise;
    }

    async function openPreview(pdf,name){
      activePreviewPdf=pdf;
      activePreviewPage=1;
      modalEventName.textContent=name||"Event BEO";
      pdfModal.classList.add("open");
      pdfModal.setAttribute("aria-hidden","false");
      document.body.style.overflow="hidden";
      await renderModalPage();
    }

    async function renderModalPage(){
      if(!activePreviewPdf)return;
      prevPage.disabled=activePreviewPage<=1;
      nextPage.disabled=activePreviewPage>=activePreviewPdf.numPages;
      pageCounter.textContent=activePreviewPage+" of "+activePreviewPdf.numPages;

      if(modalRenderTask){
        try{modalRenderTask.cancel()}catch(_){}
        modalRenderTask=null;
      }

      modalCanvas.style.display="none";
      modalLoading.style.display="block";

      try{
        const page=await activePreviewPdf.getPage(activePreviewPage);
        const base=page.getViewport({scale:1});
        const scale=Math.min((innerWidth*.82)/base.width,(innerHeight*.75)/base.height,1.7);
        const viewport=page.getViewport({scale});
        const output=Math.min(devicePixelRatio||1,2);
        const ctx=modalCanvas.getContext("2d");

        modalCanvas.width=Math.floor(viewport.width*output);
        modalCanvas.height=Math.floor(viewport.height*output);
        modalCanvas.style.width=Math.floor(viewport.width)+"px";
        modalCanvas.style.height=Math.floor(viewport.height)+"px";

        modalRenderTask=page.render({canvasContext:ctx,viewport,transform:output!==1?[output,0,0,output,0,0]:null});
        await modalRenderTask.promise;
        modalLoading.style.display="none";
        modalCanvas.style.display="block";
        modalRenderTask=null;
      }catch(err){
        if(err&&err.name!=="RenderingCancelledException")console.error(err);
      }
    }

    function closePreview(){
      pdfModal.classList.remove("open");
      pdfModal.setAttribute("aria-hidden","true");
      document.body.style.overflow="";
      activePreviewPdf=null;
      activePreviewPage=1;
      if(modalRenderTask){try{modalRenderTask.cancel()}catch(_){}modalRenderTask=null}
    }

    prevPage.addEventListener("click",()=>{if(activePreviewPdf&&activePreviewPage>1){activePreviewPage--;renderModalPage()}});
    nextPage.addEventListener("click",()=>{if(activePreviewPdf&&activePreviewPage<activePreviewPdf.numPages){activePreviewPage++;renderModalPage()}});
    modalClose.addEventListener("click",closePreview);
    pdfModal.addEventListener("click",e=>{if(e.target===pdfModal)closePreview()});
    document.addEventListener("keydown",e=>{
      if(!pdfModal.classList.contains("open"))return;
      if(e.key==="Escape")closePreview();
      if(e.key==="ArrowLeft"&&activePreviewPage>1){activePreviewPage--;renderModalPage()}
      if(e.key==="ArrowRight"&&activePreviewPdf&&activePreviewPage<activePreviewPdf.numPages){activePreviewPage++;renderModalPage()}
    });

    async function extractLines(page){
      const content=await page.getTextContent();
      const items=content.items.filter(i=>i.str&&i.str.trim()).map(i=>({text:i.str.trim(),x:(i.transform&&i.transform[4])||0,y:(i.transform&&i.transform[5])||0,width:i.width||0}));
      const rows=[];
      for(const item of items){
        let row=rows.find(r=>Math.abs(r.y-item.y)<=2.25);
        if(!row){row={y:item.y,items:[]};rows.push(row)}
        row.items.push(item);
      }
      rows.sort((a,b)=>b.y-a.y);
      return rows.map(row=>{
        row.items.sort((a,b)=>a.x-b.x);
        let line="",right=null;
        for(const item of row.items){
          if(right!==null)line+=item.x-right>8?"  ":" ";
          line+=item.text;
          right=item.x+item.width;
        }
        return clean(line);
      }).filter(Boolean);
    }

    async function terminalMessage(message,tone=""){
      const line=document.createElement("div");
      line.className="terminal-line"+(tone?" "+tone:"");
      const prompt=document.createElement("span");
      prompt.className="prompt";
      prompt.textContent=tone==="success"?"✓":">";
      const content=document.createElement("span");
      line.append(prompt,content);
      terminal.appendChild(line);

      if(reduced){
        content.textContent=message;
        return;
      }

      const cursor=document.createElement("span");
      cursor.className="cursor";
      content.appendChild(cursor);

      for(let i=0;i<message.length;i++){
        cursor.insertAdjacentText("beforebegin",message[i]);
        terminal.scrollTop=terminal.scrollHeight;
        await delay(2+Math.random()*3);
      }

      cursor.remove();
      await delay(12);
    }

    function parseMoney(value){
      const n=Number(String(value||"").replace(/USD|\$|,/gi,"").trim());
      return Number.isFinite(n)?n:null;
    }
    function formatSignedMoney(value){
      if(value===null||!Number.isFinite(value))return"—";
      if(Math.abs(value)<0.005)return formatMoney(0);
      return value>0?"+"+formatMoney(value):formatMoney(value);
    }
        function formatMoney(value){
      if(value===null||!Number.isFinite(value))return"—";
      return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(value);
    }
    function clean(v){return String(v||"").replace(/\s+/g," ").replace(/^[-–—|]+|[-–—|]+$/g,"").trim()}
    function esc(v){return String(v).replace(/[-\/\\^$*+?.()|[\]{}]/g,"\\$&")}
    function formatBytes(b){if(!Number.isFinite(b)||b<=0)return"PDF";if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(1)+" KB";return(b/1048576).toFixed(1)+" MB"}
    function delay(ms){return new Promise(r=>setTimeout(r,ms))}
  </script>
